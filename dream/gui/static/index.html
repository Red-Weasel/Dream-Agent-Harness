/* ---------- visual answers (Phase 8) ---------------------------------------- */
// Typed cards from the *_display_v0 tools, the image row, the research offer,
// and a widget in the sandboxed artifact frame. Every string is model text:
// escaped before it touches the DOM; a link is only ever http(s); a color is
// only ever a hex literal. Nothing here fetches — except the image thumbnails,
// and only when the user asked for pictures.
const WIDGET_STYLE = `<style>:root{--bg:#ffffff;--surface:#f4f5f9;--line:#d8dce6;--text:#0b0d12;--muted:#5b6377;
  --accent:#8b5cf6;--accent-2:#22d3ee;--ok:#059669;--warn:#d97706;--danger:#dc2626;--radius:10px;
  --font:system-ui,-apple-system,"Segoe UI",Inter,sans-serif}
  html,body{margin:0}body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);padding:12px}</style>`;
const httpUrl = u => /^https?:\/\/[^\s"'<>]+$/.test(String(u || '')) ? String(u) : '';
const hexColor = c => /^#[0-9a-f]{3,8}$/i.test(String(c || '')) ? String(c) : '';
const PALETTE = ['#8b5cf6', '#22d3ee', '#34d399', '#fbbf24', '#f87171', '#a78bfa', '#67e8f9', '#6ee7b7'];

function renderWidget(d){
  const name = String(d.widget || ''), data = (d.data && typeof d.data === 'object') ? d.data : {};
  if(name === 'visualize_show_widget'){
    if(COMPANION) artView = 'preview';
    // Same frame, same sandbox, same CSP as a written page — plus the tokens.
    const title = String(data.title || 'widget').slice(0, 80);
    const a = addArtifact('widget:' + title, title, data.kind === 'svg' ? 'svg' : 'html', String(data.code || ''));
    a.widget = true;
    openArtifact(a.key);
    return;
  }
  endTurn();
  const el = document.createElement('div');
  const cls = {image_search: 'images', suggest_research: 'research'}[name] || name.replace(/_display_v0$/, '');
  el.className = 'vcard ' + cls.replace(/[^a-z0-9_]/gi, '');
  el.innerHTML = renderCard(name, data, d.text);
  wireCard(el);
  stream.appendChild(el); scroll(true);
  companion?.interaction(el, 'widget');
}

function renderCard(name, a, text){
  const head = (label, title) => `<div class="vh">${esc(label)}${title ? ` · <b>${esc(title)}</b>` : ''}</div>`;
  const summary = a.summary ? `<div class="vs">${esc(a.summary)}</div>` : '';
  const link = (u, t) => { const h = httpUrl(u); return h ? `<a href="${esc(h)}" target="_blank" rel="noopener noreferrer">${esc(t || h)}</a>` : esc(t || ''); };
  const products = ps => `<div class="prow">${(ps || []).map(p => `<div class="ptile">
      <b>${esc(p.name)}</b>${p.price ? `<span class="price">${esc(p.price)}</span>` : ''}
      ${p.blurb ? `<p>${esc(p.blurb)}</p>` : ''}
      ${(p.attributes || []).map(at => `<div class="kv"><span>${esc(at.label)}</span><b>${esc(at.value)}</b></div>`).join('')}
      ${httpUrl(p.url) ? `<div>${link(p.url, 'open →')}</div>` : ''}</div>`).join('')}</div>`;
  switch(name){
    case 'chart_display_v0':
      return head(String(a.style || '') + ' chart', a.title) + chartSvg(a) + summary;
    case 'comparison_card_display_v0': {
      const ps = a.products || [], labels = [];
      ps.forEach(p => (p.attributes || []).forEach(at => { if(!labels.includes(at.label)) labels.push(at.label); }));
      const cell = (p, l) => { const at = (p.attributes || []).find(x => x.label === l); return esc(at ? at.value : '—'); };
      return head('comparison') + `<div class="tscroll"><table class="cmp"><thead><tr><th></th>${ps.map(p =>
          `<th><b>${esc(p.name)}</b>${p.price ? `<span class="price">${esc(p.price)}</span>` : ''}${httpUrl(p.url) ? `<div>${link(p.url, 'open →')}</div>` : ''}</th>`).join('')}</tr></thead>
        <tbody>${labels.map(l => `<tr><th>${esc(l)}</th>${ps.map(p => `<td>${cell(p, l)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` + summary;
    }
    case 'featured_card_display_v0': return head('pick') + products(a.products) + summary;
    case 'product_carousel_display_v0': return head('products') + products(a.products) + summary;
    case 'itinerary_display_v0':
      return head('itinerary', a.title) + (a.days || []).map((d, i) => `<details class="day"${i === 0 ? ' open' : ''}><summary>${esc(d.day_label)}</summary>
        <ul>${(d.stops || []).map(s => `<li>${s.time ? `<span class="time">${esc(s.time)}</span>` : ''}<b>${esc(s.name)}</b>${s.blurb ? ` — ${esc(s.blurb)}` : ''}</li>`).join('')}</ul></details>`).join('') + summary;
    case 'link_preview_display_v0':
      return head('links') + (a.links || []).map(l => { const dom = l.domain || String(l.url || '').replace(/^https?:\/\/([^/]+).*$/, '$1');
        return `<div class="lnk">${link(l.url, l.title)}<span class="dom">${esc(dom)}</span>${l.snippet ? `<p>${esc(l.snippet)}</p>` : ''}</div>`; }).join('') + summary;
    case 'options_card_display_v0':
      return head('options', a.title) + `<div class="ogrid">${(a.options || []).map(o => `<div class="opt"><b>${esc(o.title)}</b><p>${esc(o.description)}</p>

        ${(p.tips || []).map(t => `<span class="pill">${esc(t)}</span>`).join('')}</div>`).join('') + summary;
    case 'quiz_display_v0':

    case 'step_card_display_v0': {

        : `<li><details${i === 0 ? ' open' : ''}><summary>${esc(s.title)}</summary><p>${esc(s.description)}</p></details></li>`).join('')}</ol>` + summary;
    }
    case 'translation_display_v0':
      return head('translation', `${a.source_language} → ${a.target_language}`) + `<div class="tr2">
        <div><span class="dom">${esc(a.source_language)}</span><p>${esc(a.source_text)}</p><button type="button" class="copy" data-copy="${esc(a.source_text)}">copy</button></div>
        <div><span class="dom">${esc(a.target_language)}</span><p lang="${esc(a.target_lang || '')}">${esc(a.translation)}</p>${a.pronunciation ? `<i>${esc(a.pronunciation)}</i>` : ''}<button type="button" class="copy" data-copy="${esc(a.translation)}">copy</button></div></div>` + summary;
    case 'image_search':
      return head('images', a.query) + `<div class="irow">${(a.images || []).map(im => {
        const page = httpUrl(im.page) || httpUrl(im.src), thumb = httpUrl(im.thumb) || httpUrl(im.src);
        if(!thumb) return '';
        const dims = (im.width && im.height) ? `${+im.width}×${+im.height}` : '';
        return `<a href="${esc(page)}" target="_blank" rel="noopener noreferrer" title="${esc(im.title)}"><img src="${esc(thumb)}" alt="${esc(im.title)}" referrerpolicy="no-referrer" loading="lazy"><span>${esc(dims)}</span></a>`; }).join('')}</div>`;
    case 'suggest_research':
      return head('research') + `<div class="rs"><p>${esc(a.rationale)}</p><button type="button" data-rationale="${esc(a.rationale)}">Start research</button></div>`;
    case 'suggest_plugins':
    case 'suggest_skills': {
      // Phase 12: an offer. Each button fills the user's composer; only the user sends.
      const verb = name === 'suggest_plugins' ? 'Enable plugin' : 'Use skill';
      const items = Array.isArray(a.items) ? a.items.slice(0, 6) : [];
      return head(name === 'suggest_plugins' ? 'plugins to enable' : 'skills to try') + `<div class="rs">${items.map(it =>
        `<p><b>${esc(it.id)}</b> — <span class="what">${esc(it.what)}</span> <button type="button" class="offer" data-fill="${esc(verb + ' ' + String(it.id || '').slice(0, 80))}">${esc(verb)}</button></p>`).join('')}${
        name === 'suggest_plugins' ? '<p class="vs">Enabling is a plugin.yaml edit; it takes effect at the next boot.</p>' : ''}</div>`;
    }
    default:
      // A card this page does not know yet: its text form, never its markup.
      return head(name.replace(/_/g, ' ')) + `<pre>${esc(text || JSON.stringify(a, null, 2))}</pre>`;
  }
}

function chartSvg(a){
  const W = 640, H = 300, L = 48, R = 16, T = 28, B = 40;
  const style = a.style || 'bar', series = (a.series || []).filter(s => s && typeof s === 'object');
  const cats = ((a.x_axis || {}).categories || []).map(String), ya = a.y_axis || {}, xa = a.x_axis || {};
  const pts = series.map(s => Array.isArray(s.points) && s.points.length
    ? s.points.map(p => [+p.x, +p.y]) : (s.values || []).map((v, i) => [i, +v]));
  const all = pts.flat().filter(p => isFinite(p[0]) && isFinite(p[1]));
  if(!all.length) return '<div class="vs">no data</div>';
  let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0]));
  let y0 = isFinite(+ya.min) && ya.min !== undefined ? +ya.min : Math.min(0, ...all.map(p => p[1]));
  let y1 = isFinite(+ya.max) && ya.max !== undefined ? +ya.max : Math.max(...all.map(p => p[1]));
  if(x1 === x0) x1 = x0 + 1;
  if(y1 === y0) y1 = y0 + 1;
  const n = Math.max(cats.length, ...pts.map(p => p.length), 1);
  const sx = x => L + (style === 'bar' ? (x + 0.5) / n : (x - x0) / (x1 - x0)) * (W - L - R);
  const sy = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const col = (s, i) => hexColor(s.color) || PALETTE[i % PALETTE.length];
  const fmt = v => (+v).toLocaleString(undefined, {maximumFractionDigits: 2});
  let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(a.title || style + ' chart')}">`;
  for(let i = 0; i <= 4; i++){ const v = y0 + (y1 - y0) * i / 4, y = sy(v);
    out += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="grid"/><text x="${L - 6}" y="${y + 4}" class="tick" text-anchor="end">${esc(fmt(v))}</text>`; }
  if(style === 'bar' || cats.length){
    const step = Math.max(1, Math.ceil(n / 12));
    for(let i = 0; i < n; i += step) out += `<text x="${sx(i)}" y="${H - B + 16}" class="tick" text-anchor="middle">${esc(String(cats[i] ?? i + 1).slice(0, 14))}</text>`;
  } else {
    for(let i = 0; i <= 4; i++){ const v = x0 + (x1 - x0) * i / 4; out += `<text x="${sx(v)}" y="${H - B + 16}" class="tick" text-anchor="middle">${esc(fmt(v))}</text>`; }
  }
  const zero = sy(Math.max(y0, Math.min(y1, 0)));
  series.forEach((s, si) => {
    const c = col(s, si), P = pts[si], label = s.name ? s.name + ': ' : '';
    if(style === 'bar'){
      const bw = (W - L - R) / n / series.length * 0.7, off = (si - (series.length - 1) / 2) * bw / 0.7;
      P.forEach(([, y], i) => { if(!isFinite(y)) return; const yy = sy(y);
        out += `<rect x="${sx(i) + off - bw / 2}" y="${Math.min(yy, zero)}" width="${bw}" height="${Math.abs(zero - yy)}" fill="${c}" rx="2"><title>${esc(label + fmt(y))}</title></rect>`; });
    } else {
      const ok = P.filter(p => isFinite(p[0]) && isFinite(p[1]));
      if(style === 'line') out += `<polyline points="${ok.map(([x, y]) => `${sx(x)},${sy(y)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2"/>`;
      ok.forEach(([x, y]) => { out += `<circle cx="${sx(x)}" cy="${sy(y)}" r="${style === 'line' ? 3 : 4}" fill="${c}"><title>${esc(label + fmt(x) + ', ' + fmt(y))}</title></circle>`; });
    }
  });
  if(xa.label) out += `<text x="${(L + W - R) / 2}" y="${H - 6}" class="tick" text-anchor="middle">${esc(xa.label)}</text>`;
  if(ya.label) out += `<text transform="translate(12 ${(T + H - B) / 2}) rotate(-90)" class="tick" text-anchor="middle">${esc(ya.label)}</text>`;
  out += '</svg>';
  const legend = (series.length > 1 || series.some(s => s.name))
    ? `<div class="legend">${series.map((s, i) => `<span><i style="background:${col(s, i)}"></i>${esc(s.name || 'series ' + (i + 1))}</span>`).join('')}</div>` : '';
  return out + legend;
}

function quizHtml(a){
  const flash = a.initial_mode === 'flashcards';
  return `<div class="qz">${(a.questions || []).map((q, i) => `<details class="q"${i === 0 ? ' open' : ''} data-correct="${esc(q.correct_option_id)}">
    <summary>${i + 1}. ${esc(q.question)}</summary>
    ${q.hint ? `<div class="hint">hint: ${esc(q.hint)}</div>` : ''}
    <div class="opts">${(q.options || []).map(o => flash
      ? `<div class="opt${o.id === q.correct_option_id ? ' right' : ''}">${esc(o.text)}</div>`
      : `<button type="button" class="opt" data-id="${esc(o.id)}">${esc(o.text)}</button>`).join('')}</div>
    <div class="expl"${flash ? '' : ' hidden'}>${esc(q.explanation)}</div>
    ${!flash && q.correct_feedback ? `<div class="fb ok" hidden>${esc(q.correct_feedback)}</div>` : ''}
    ${!flash && q.incorrect_feedback ? `<div class="fb bad" hidden>${esc(q.incorrect_feedback)}</div>` : ''}
  </details>`).join('')}</div>`;
}

// One listener per card: quiz answers, copy buttons, the research button.
function wireCard(el){
  el.addEventListener('click', async e => {
    const opt = e.target.closest('button.opt');
    if(opt){
      const q = opt.closest('details.q'); if(!q || q.dataset.done) return;
      q.dataset.done = '1';
      const right = opt.dataset.id === q.dataset.correct;
      opt.classList.add(right ? 'right' : 'wrong');
      q.querySelectorAll('button.opt').forEach(b => { b.disabled = true; if(b.dataset.id === q.dataset.correct) b.classList.add('right'); });
      q.querySelector('.expl').hidden = false;
      const fb = q.querySelector(right ? '.fb.ok' : '.fb.bad'); if(fb) fb.hidden = false;
      return;
    }
    const cp = e.target.closest('button.copy');
    if(cp){
      try{ await navigator.clipboard.writeText(cp.dataset.copy || ''); cp.textContent = 'copied'; }
      catch(err){ cp.textContent = 'copy failed'; }
      setTimeout(() => { cp.textContent = 'copy'; }, 1200);
      return;
    }
    const offer = e.target.closest('button.offer');
    if(offer){
      // An offer fills the composer and never sends: the user's message is the user's.
      const t = String(offer.dataset.fill || '').slice(0, 200), had = input.value.trim();
      input.value = had ? had + '\n' + t : t; companion?.compose(); grow(); input.focus();
      return;
    }
    const go = e.target.closest('.rs button');
    if(go){
      // The user pressed it: this is their message, sent the way their typed ones are.
      go.disabled = true; go.textContent = 'started';
      postPrompt(`Research it: ${go.dataset.rationale}. Delegate to the researcher subagent and report back with sources.`);
    }
  });
}

/* ---------- question forms (questions_v2) ----------------------------------- */
// The model's form, as native controls. Option text is model text — escaped.
// An svg-options swatch is model markup — it renders inside its own fully
// sandboxed frame (no scripts), never inline in this page.
const SWATCH_CSP = "default-src 'none'; style-src 'unsafe-inline'; img-src data:";
function swatchFrame(svg){
  const sv = document.createElement('iframe');
  sv.setAttribute('sandbox', '');
  sv.setAttribute('referrerpolicy', 'no-referrer');
  sv.srcdoc = `<!doctype html><meta http-equiv="Content-Security-Policy" content="${SWATCH_CSP}">
    <style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#fff}svg{max-width:100%;max-height:100%}</style>${svg}`;
  return sv;
}
function renderForm(form){
  endTurn();
  const qs = Array.isArray(form.questions) ? form.questions : [];
  // visual_check: workspace images shown inline above the question, served by the
  // token-checked download route (workspace files only); the path and the caption are model text.
  const imgs = Array.isArray(form.images) ? form.images : [];
  const strip = !imgs.length ? '' : `<div class="qimgs">` + imgs.map(im => {
    const href = '/api/download?path=' + encodeURIComponent(String(im.path || '')) + '&token=' + encodeURIComponent(TOKEN);
    const cap = esc(String(im.name || im.path || '')) + (im.size ? ' · ' + esc(String(im.size)) : '');
    return `<figure class="qimg"><a href="${href}" target="_blank" rel="noopener"><img src="${href}" alt="${cap}"></a><figcaption>${cap}</figcaption></figure>`;
  }).join('') + `</div>`;
  const el = document.createElement('form');
  el.className = 'qform';
  el.innerHTML = `<div class="qtitle">${esc(form.title || 'Questions')}</div>` + strip + qs.map((q, i) => {
    const id = esc(String(q.id || ('q' + i))), kind = esc(String(q.kind || 'freeform'));
    const sub = q.subtitle ? `<div class="qsub">${esc(q.subtitle)}</div>` : '';
    let body = '';
    if(q.kind === 'text-options'){
      const type = q.multi ? 'checkbox' : 'radio';
      body = (q.options || []).map(o => `<label class="qopt"><input type="${type}" name="${id}" value="${esc(o)}"> ${esc(o)}</label>`).join('')
        + `<input type="text" class="qother" name="${id}__other" placeholder="Other…">`;
    } else if(q.kind === 'svg-options'){
      const type = q.multi ? 'checkbox' : 'radio';
      body = (q.options || []).map((_, j) => `<label class="qsvg"><input type="${type}" name="${id}" value="${j}" hidden><span class="qsvgbox" data-svg="${j}"></span></label>`).join('');
    } else if(q.kind === 'slider'){
      const lo = +q.min || 0, hi = isFinite(+q.max) ? +q.max : 100, st = +q.step || 1, dv = isFinite(+q.default) ? +q.default : lo;
      body = `<input type="range" name="${id}" min="${lo}" max="${hi}" step="${st}" value="${dv}"><output>${dv}</output>`;
    } else if(q.kind === 'file'){
      body = `<input type="file" name="${id}"${q.accept ? ` accept="${esc(q.accept)}"` : ''}>`;
    } else {
      body = `<textarea name="${id}"></textarea>`;
    }
    return `<fieldset class="q" data-kind="${kind}" data-id="${id}"><legend>${esc(q.title || '')}</legend>${sub}${body}</fieldset>`;
  }).join('') + `<div class="qacts"><button type="submit">Send answers</button></div>`;
  // swatches go into sandboxed frames after the markup is in place
  qs.forEach((q, i) => { if(q.kind !== 'svg-options') return;
    const fs = el.querySelector(`fieldset[data-id="${CSS.escape(String(q.id || ('q' + i)))}"]`);
    (q.options || []).forEach((svg, j) => { const box = fs && fs.querySelector(`.qsvgbox[data-svg="${j}"]`); if(box) box.appendChild(swatchFrame(String(svg))); });
  });
  el.querySelectorAll('input[type=range]').forEach(r => r.oninput = () => { r.nextElementSibling.textContent = r.value; });
  el.onsubmit = async e => { e.preventDefault(); await submitForm(el, form); };
  stream.appendChild(el); scroll(true);
  companion?.interaction(el, 'question');
}
async function submitForm(el, form){
  if(el.dataset.submitting === 'true') return;
  el.dataset.submitting = 'true';
  const buttons = [...el.querySelectorAll('button')]; buttons.forEach(b => b.disabled = true);
  try {
  const answers = {};
  for(const fs of el.querySelectorAll('fieldset.q')){
    const id = fs.dataset.id, kind = fs.dataset.kind;
    if(kind === 'text-options' || kind === 'svg-options'){
      const picked = [...fs.querySelectorAll(`input[name="${CSS.escape(id)}"]:checked`)].map(i => i.value);
      const other = fs.querySelector('.qother');
      const vals = picked.map(v => (kind === 'svg-options') ? ('option ' + (+v + 1)) : v);
      if(other && other.value.trim()) vals.push(other.value.trim());
      if(!vals.length) continue;
      answers[id] = vals.length === 1 ? vals[0] : vals;
    } else if(kind === 'slider'){
      answers[id] = +fs.querySelector('input[type=range]').value;
    } else if(kind === 'file'){
      const inp = fs.querySelector('input[type=file]');
      if(inp && inp.files && inp.files[0]){
        const fd = new FormData(); fd.append('file', inp.files[0]);
        try{
          const r = await fetch('/api/upload', {method:'POST', headers:{'X-Dream-Token':TOKEN}, body: fd});
          const j = await r.json();
          if(!r.ok || !j.path){ sysline('Upload failed: ' + (j.error || r.status) + '. Your answers are kept. Retry or choose another file.', 'error'); return; }
          answers[id] = j.path;
        }catch(e){ sysline('Upload failed. Your answers are kept; reconnect and try again.', 'error'); return; }
      }
    } else {
      const t = fs.querySelector('textarea'); if(t && t.value.trim()) answers[id] = t.value.trim();
    }
  }
  if(!Object.keys(answers).length){ sysline('answer at least one question', 'error'); return; }
  try{
    const r = await fetch('/api/answer', {method:'POST', headers:{'Content-Type':'application/json','X-Dream-Token':TOKEN},
      body: JSON.stringify({title: form.title || 'the form', answers})});
    const j = await r.json();
    if(!r.ok){ sysline('could not send answers — ' + (j.error || r.status), 'error'); return; }
    el.remove();
    companion?.interactions();
    // Accepted user messages arrive through the shared server event once.
    busy(true); scroll(true);
  }catch(e){ sysline('could not reach Dream — is the terminal still running?', 'error'); }
  } finally { el.dataset.submitting = 'false'; buttons.forEach(b => b.disabled = false); }
}

/* ---------- tweaks (edit mode) ---------------------------------------------- */
// A page that registers for edit mode gets a Tweaks toggle. Its edits are
// persisted into the file on disk — only an artifact that IS a file.
let tweaksOn = false, tweaksAvail = false;
const tweakBtn = $('arttweaks');
function artifactFilePath(){ return (artOpen && artOpen.startsWith('file:')) ? artOpen.slice(5) : null; }
tweakBtn.onclick = () => {
  tweaksOn = !tweaksOn; tweakBtn.classList.toggle('on', tweaksOn);

};

/* ---------- point mode (mentioned-element) ---------------------------------- */
// Click an element in the open artifact; the next message carries a
// <mentioned-element> block naming it, the way a comment on it would.
let pointOn = false, mention = null;
const pointBtn = $('artpoint'), mentionEl = $('mention');
function mentionBlock(m){
  return ['<mentioned-element>',
    m.label ? `screen: ${m.label}` : null,
    m.react ? `react: ${m.react}` : null,
    `dom: ${m.dom}`,
    `id: data-cc-id="${m.id}"`,
    m.text ? `text: ${m.text}` : null,
    '</mentioned-element>'].filter(Boolean).join('\n');
}
function clearMention(){ mention = null; mentionEl.style.display = 'none'; }
$('mentionclear').onclick = clearMention;
pointBtn.onclick = () => {
  pointOn = !pointOn; pointBtn.classList.toggle('on', pointOn);
  const f = artbody.querySelector('iframe');
  if(f && f.contentWindow) f.contentWindow.postMessage({type: pointOn ? '__dream_point_on' : '__dream_point_off'}, '*');
};
window.addEventListener('message', e => {
  const f = artbody.querySelector('iframe');
  if(!f || e.source !== f.contentWindow) return;   // only the open artifact frame
  const d = e.data || {};
  if(d.type === '__edit_mode_available'){
    tweaksAvail = true; tweakBtn.style.display = '';
    if(tweaksOn) f.contentWindow.postMessage({type:'__activate_edit_mode'}, '*');
  } else if(d.type === '__edit_mode_set_keys'){
    const path = artifactFilePath();
    if(!path){ sysline('tweak not saved — this artifact is not a file on disk', 'error'); return; }
    if(!d.edits || typeof d.edits !== 'object') return;
    fetch('/api/tweak', {method:'POST', headers:{'Content-Type':'application/json','X-Dream-Token':TOKEN},
      body: JSON.stringify({path, edits: d.edits})})
      .then(r => r.json()).then(j => { if(j.error) sysline('tweak not saved — ' + j.error, 'error'); }).catch(() => {});
  } else if(d.type === '__dream_pong'){
    clearTimeout(f._pong);
  } else if(d.type === '__dream_send_prompt'){
    // A widget fills the user's composer; only the user sends. Never submitted here,
    // and never over what he was typing: the text joins on a new line.
    const t = String(d.text || '').slice(0, 4000), had = input.value.trim();
    if(had.length + t.length > 8000) return;   // a page cannot grow the composer without bound
    input.value = had ? had + '\n' + t : t; companion?.compose(); grow(); input.focus();
  } else if(d.type === '__dream_mention'){
    // Only while pointing, and only so much: a page can post this itself, and
    // whatever it says rides into the user's own message.
    if(!pointOn) return;
    const cap = (v, n) => String(v || '').slice(0, n);
    mention = {id: cap(d.id, 16), dom: cap(d.dom, 300), react: cap(d.react, 200),
               label: cap(d.label, 80), text: cap(d.text, 80)};
    $('mentiontext').textContent = 'pointing at: ' + (mention.label ? mention.label + ' · ' : '')
      + mention.dom + (mention.text ? ' — “' + mention.text + '”' : '');
    mentionEl.style.display = '';
    companion?.compose();
    input.focus();
  }
});

/* ---------- the user's view: Dream asks the open artifact ------------------ */
// Dream's eval_js_user_view / screenshot_user_view. The question comes in as a
// studio event with an id; it is posted into the open frame; the frame's reply
// is POSTed back. With nothing open, this page answers "no" itself, so the tool
// on the other end never waits on a frame that does not exist.
function frameReply(id, ok, value){
  fetch('/api/frame_reply', {method:'POST',
    headers:{'Content-Type':'application/json','X-Dream-Token':TOKEN},
    body: JSON.stringify({id, ok, value})}).catch(() => {});
}
let frameReady = false;   // the open frame has fired load (its bridge is listening)
function askFrame(d){
  const f = artbody.querySelector('iframe');
  if(!artOpen){ frameReply(d.id, false, 'no artifact is open in the Studio panel'); return; }
  if(!f || !f.contentWindow){
    frameReply(d.id, false, artView === 'code'
      ? 'the artifact is open in code view — the preview must be showing for this'
      : 'no artifact frame is showing in the Studio panel');
    return;
  }
  const msg = d.op === 'snapshot' ? {type:'__dream_snapshot', id:d.id}
                                  : {type:'__dream_eval', id:d.id, code:String(d.code || '')};
  const post = () => { try{ f.contentWindow.postMessage(msg, '*'); }catch(e){ frameReply(d.id, false, String(e)); } };
  // An ask that lands while the frame is still loading would reach a bridge
  // that is not listening yet; wait for load instead of losing it.
  if(frameReady) post(); else f.addEventListener('load', post, {once: true});
}
window.addEventListener('message', e => {
  const d = e.data || {};
  if(d.type !== '__dream_reply' || !d.id) return;
  // Only the open artifact frame may answer — never another window.
  const f = artbody.querySelector('iframe');
  if(!f || e.source !== f.contentWindow) return;
  frameReply(String(d.id), !!d.ok, d.value);
});

$('artver').onchange = e => { artVerIdx = +e.target.value; paintArtifact(); };
$('artprev').onclick = () => { artView = 'preview'; paintArtifact(); };
$('artcode').onclick = () => { artView = 'code'; paintArtifact(); };
$('artclose').onclick = () => {

  // Closing only hid the panel: the iframe stayed loaded and kept driving its
  // render loop. A three.js artifact then held the display GPU at 60-90% for
  // hours with nothing on screen (2026-09-20). Tear the frame down; reopening
  // calls paintArtifact(), which rebuilds it from the stored content.
  closeArtifactFrame();
  companion?.closeArtifact();
};

function closeArtifactFrame(){
  const f = artbody.querySelector('iframe');
  // Removing the iframe destroys its document and its render loop. Do NOT set
  // f.src here: artifact frames are srcdoc-only, and a guard test enforces it.
  if(f){ f.srcdoc = ''; f.remove(); }
  artbody.replaceChildren();
  frameReady = false;
}

// Detection 1: renderable fenced blocks in what Dream says.
function scanForArtifacts(text, seq){
  const re = /```(\w*)\n([\s\S]*?)```/g;
  let m, i = 0;
  while((m = re.exec(text))){
    const kind = artKind(m[1], m[2]);
    if(!kind) { i++; continue; }
    addArtifact(`msg${seq}:${i}`, `${kind === 'svg' ? 'Diagram' : 'Page'} ${seq}.${i+1}`, kind, m[2].trim());
    i++;
  }
}

// Detection 2: a file Dream WROTE that a browser can render.
function artifactFromWrite(input){
  const path = String(input.file_path || input.path || '');
  const body = input.content;
  if(typeof body !== 'string' || !path) return;
  const ext = path.split('.').pop().toLowerCase();
  const kind = (ext === 'html' || ext === 'htm') ? 'html' : (ext === 'svg' ? 'svg' : artKind('', body));
  if(!kind) return;
  return addArtifact(`file:${path}`, path.split('/').pop(), kind, body);
}
