<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dream Studio</title>
<link rel="icon" href="/assets/dream-app-icon.png" type="image/png">
<link rel="stylesheet" href="/assets/media.css">
<script>document.documentElement.classList.toggle('companion', new URLSearchParams(location.search).get('companion') === '1');</script>
<style>
:root{
  --violet:#8b5cf6; --cyan:#22d3ee;
  --bg:#0b0d12; --bg2:#11141c; --panel:#141824; --line:#232838;
  --fg:#e6e9f2; --dim:#8b93a7; --faint:#5b6377;
  --ok:#34d399; --err:#f87171; --warn:#fbbf24;
  --grad:linear-gradient(100deg,var(--violet),var(--cyan));
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Inter,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans);display:flex;flex-direction:column;overflow:hidden}

/* header */
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--bg2);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.wordmark{font:700 15px/1 var(--mono);letter-spacing:.28em;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.meta{display:flex;gap:14px;color:var(--dim);font:11px/1 var(--mono);flex-wrap:wrap}
.meta b{color:var(--fg);font-weight:500}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;font:11px/1 var(--mono);color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:.3s}
.dot.on{background:var(--ok);box-shadow:0 0 9px var(--ok)}
.dot.off{background:var(--err)}
.dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

/* stream */
main{flex:1;min-width:380px;overflow-y:auto;padding:22px 20px 8px;scroll-behavior:auto}
.wrap{max-width:860px;margin:0 auto}
.msg{margin-bottom:20px;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.who{font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  margin-bottom:7px;display:flex;align-items:center;gap:7px}
.you .who{color:var(--cyan)}
.dream .who{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.body{padding-left:2px}
.you .body{background:var(--panel);border-left:2px solid var(--cyan);
  padding:10px 14px;border-radius:0 7px 7px 0;white-space:pre-wrap}

/* markdown */
.body p{margin:0 0 10px}
.body h1,.body h2,.body h3{margin:16px 0 8px;line-height:1.3}
.body h1{font-size:1.35em}.body h2{font-size:1.18em}.body h3{font-size:1.05em}
.body ul,.body ol{margin:0 0 10px;padding-left:22px}
.body li{margin:3px 0}
.body a{color:var(--cyan)}
.body code{font:.88em var(--mono);background:#1b2030;padding:1.5px 5px;border-radius:4px;color:#c4b5fd}
.body pre{background:#0d1017;border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.body pre code{background:none;padding:0;color:#cbd5e1;font-size:12.5px;line-height:1.55}
.body blockquote{border-left:2px solid var(--line);margin:0 0 10px;padding-left:12px;color:var(--dim)}
.body table{border-collapse:collapse;margin:0 0 12px;font-size:13px}
.body th,.body td{border:1px solid var(--line);padding:5px 10px;text-align:left}
.body th{background:var(--panel)}
.cursor{display:inline-block;width:7px;height:15px;background:var(--cyan);
  vertical-align:-2px;animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}

/* tools */
.tool{border:1px solid var(--line);border-radius:8px;margin:0 0 8px;background:var(--panel);overflow:hidden}
.tool>summary{cursor:pointer;padding:8px 12px;font:12px/1.4 var(--mono);color:var(--dim);
  display:flex;align-items:center;gap:9px;list-style:none}
.tool>summary::-webkit-details-marker{display:none}
.tool>summary:hover{color:var(--fg)}
.tool .tname{color:var(--violet);font-weight:600}
.tool .targ{color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tool .badge{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:99px;
  background:#1b2030;color:var(--dim);flex:0 0 auto}
.tool-preview{margin:0 0 8px;padding:10px 12px;max-height:40vh;overflow:auto;border:1px dashed var(--line);
  border-radius:8px;background:#0d1017;color:var(--dim);font:11.5px/1.5 var(--mono);white-space:pre-wrap;
  overflow-wrap:anywhere}
.tool-preview::before{content:'Writing\2026';display:block;color:var(--violet);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.tool.err{border-color:#4a2226}
.tool.err .badge{background:#3b1d21;color:var(--err)}
.tool pre{margin:0;padding:11px 13px;background:#0d1017;border-top:1px solid var(--line);
  font:11.5px/1.5 var(--mono);color:#9fb0c9;max-height:340px;overflow:auto;white-space:pre-wrap;
  word-break:break-word}

/* thinking + system */
.think{border-left:2px solid var(--violet);padding:2px 0 2px 12px;margin:0 0 10px;
  color:var(--faint);font-size:13px;font-style:italic;white-space:pre-wrap}
.sys{font:11.5px/1.5 var(--mono);color:var(--faint);padding:5px 0;border-top:1px dashed var(--line);
  border-bottom:1px dashed var(--line);margin:0 0 10px}
.sys.error{color:var(--err);border-color:#3b1d21}
.sys.dream-note{color:var(--violet)}   /* a note Dream wrote itself (steeringNotice), never shown as the owner's */

/* composer */
footer{flex:0 0 auto;background:var(--bg2);border-top:1px solid var(--line);padding:12px 20px 14px}
.composer{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 11px;
  transition:border-color .18s}
.composer:focus-within{border-color:var(--violet)}
textarea{flex:1;background:none;border:0;outline:0;color:var(--fg);font:14px/1.55 var(--sans);
  resize:none;max-height:190px;min-height:23px}
textarea::placeholder{color:var(--faint)}
button{background:var(--grad);border:0;border-radius:8px;color:#0b0d12;font:600 12px var(--sans);
  padding:8px 15px;cursor:pointer;flex:0 0 auto}
button:disabled{opacity:.35;cursor:default}
.hint{max-width:860px;margin:7px auto 0;color:var(--faint);font:10.5px var(--mono);display:flex;gap:16px}
#plan-panel{position:sticky;top:0;z-index:5;max-width:860px;margin:8px auto 4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font:12.5px/1.5 var(--sans, sans-serif);color:var(--fg)}
#plan-panel summary{cursor:pointer;color:var(--dim)}
#plan-panel ol{margin:6px 0 2px;padding-left:4px;list-style:none}
#plan-panel ul{margin:2px 0 4px 18px;padding:0;list-style:none;color:var(--dim)}
#plan-panel .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;border:1.5px solid #6b7280}
#plan-panel .done > .dot, #plan-panel .done > div > .dot{background:#22c55e;border-color:#22c55e}
#plan-panel .in_progress > .dot, #plan-panel .in_progress > div > .dot{background:#f59e0b;border-color:#f59e0b}
#read-twice{background:none;border:1px solid var(--line);color:var(--faint);font:inherit;border-radius:6px;padding:1px 7px;cursor:pointer}
#read-twice.on{border-color:var(--violet);color:var(--fg);background:color-mix(in srgb, var(--violet) 22%, transparent)}
#fresh-start{background:none;border:1px solid var(--line);color:var(--faint);font:inherit;border-radius:6px;padding:1px 7px;cursor:pointer}
#fresh-start:hover:not(:disabled){color:var(--fg);border-color:var(--dim)}
#fresh-start:disabled{opacity:.45;cursor:not-allowed}
/* The desktop pane (480 px): the keyboard hint yields its width to the pills rather than wrap the row, which would take a line from the preview. */
.companion footer .hint .keys{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main::-webkit-scrollbar,.tool pre::-webkit-scrollbar{width:9px;height:9px}
main::-webkit-scrollbar-thumb,.tool pre::-webkit-scrollbar-thumb{background:#252b3d;border-radius:6px}

/* telemetry rail — the thing no other app in this space does properly */
.split{flex:1;display:flex;min-height:0}
#rail{width:262px;flex:0 0 auto;background:var(--bg2);border-left:1px solid var(--line);
  overflow-y:auto;padding:14px 13px;font:11px/1.5 var(--mono)}
#rail.hide{display:none}
.rail-h{font:600 9.5px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;
  color:var(--faint);margin:0 0 9px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:10px 11px;margin:0 0 10px}
.card .nm{color:var(--fg);font-size:11.5px;margin-bottom:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.card .bdf{color:var(--faint);font-size:9.5px;margin-bottom:8px}
.bar{height:5px;border-radius:99px;background:#0d1017;overflow:hidden;margin:5px 0 3px}
.bar>i{display:block;height:100%;background:var(--grad);width:0;transition:width .45s ease}
.bar.hot>i{background:linear-gradient(90deg,var(--warn),var(--err))}
.kv{display:flex;justify-content:space-between;color:var(--dim);font-size:10.5px;padding:1.5px 0}
.kv b{color:var(--fg);font-weight:500}
.big{font:600 21px/1.15 var(--mono);background:var(--grad);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.big small{font:400 10px var(--mono);color:var(--faint);-webkit-text-fill-color:var(--faint)}
.pill{display:inline-block;font-size:9.5px;padding:1px 7px;border-radius:99px;
  background:#1b2030;color:var(--dim);margin-left:6px}
.pill.live{background:#12301f;color:var(--ok)}
#railtoggle,.tabs button{background:none;border:1px solid var(--line);color:var(--dim);
  padding:4px 9px;font:10px var(--mono);border-radius:6px;cursor:pointer}
#railtoggle:hover,.tabs button:hover{color:var(--fg);border-color:var(--violet)}
.tabs{display:flex;gap:6px;margin:0 0 11px}
.tabs button.on{color:var(--fg);border-color:var(--violet);background:#1b1630}

/* checkpoints */
.cp{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:9px 10px;margin:0 0 8px}
.cp .id{color:var(--cyan);font-weight:600}
.cp .lbl{color:var(--fg);font-size:11px;margin:3px 0;word-break:break-word}
.cp .when{color:var(--faint);font-size:9.5px}
.cp .warn{color:var(--warn);font-size:9.5px;margin-top:3px}
.cp .acts{display:flex;gap:6px;margin-top:8px}
.cp .acts button{flex:1;padding:4px 0;font-size:10px}
.cp .acts button.danger{border-color:#4a2226;color:#fca5a5}
.cp .acts button.danger:hover{background:#2a1417;border-color:var(--err)}
.cpdiff{background:#0d1017;border:1px solid var(--line);border-radius:7px;margin-top:7px;
  padding:8px 9px;font:10.5px/1.5 var(--mono);max-height:280px;overflow:auto;white-space:pre-wrap}
.cpdiff .a{color:var(--ok)}.cpdiff .d{color:var(--err)}.cpdiff .h{color:var(--violet)}

/* artifacts */
.artchip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel);padding:9px 12px;margin:0 0 10px;cursor:pointer;
  transition:border-color .15s}
.artchip:hover{border-color:var(--violet)}
.artchip .ic{width:23px;height:23px;border-radius:6px;background:var(--grad);flex:0 0 auto;
  display:grid;place-items:center;font:600 10px var(--mono);color:#0b0d12}
.artchip .t{flex:1;min-width:0}
.artchip .t b{display:block;font-size:12.5px;font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.artchip .t span{color:var(--faint);font:10px var(--mono);display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.artchip .go{color:var(--faint);font:10px var(--mono)}

#artpanel{width:min(52vw,760px);flex:0 0 auto;background:var(--bg2);
  border-left:1px solid var(--line);display:none;flex-direction:column;min-width:0}
#artpanel.open{display:flex}
.artbar{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);
  flex:0 0 auto}
.artbar .nm{flex:1;min-width:0;font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.artbar select{background:var(--panel);border:1px solid var(--line);color:var(--dim);
  border-radius:6px;font:10px var(--mono);padding:3px 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;color:var(--dim);font:10px var(--mono);padding:4px 10px;cursor:pointer}
.seg button.on{background:#1b1630;color:var(--fg)}
.artclose{background:none;border:0;color:var(--faint);font-size:17px;cursor:pointer;padding:0 4px}
.artclose:hover{color:var(--fg)}
#artbody{flex:1;min-height:0;overflow:auto;background:#fff}
#artbody.code{background:#0d1017}
#artbody iframe{width:100%;height:100%;border:0;display:block}
#artbody pre{margin:0;padding:14px;font:12px/1.6 var(--mono);color:#cbd5e1;white-space:pre-wrap;
  word-break:break-word}
#artbody.image, .companion #artbody.image{display:flex;align-items:center;justify-content:center;background:#111}
#artbody.image img{max-width:100%;max-height:100%;object-fit:contain}
/* DREAM-111: a still is labelled as one, in a strip above the picture (never over it), with
   the way back to the live page */
#artbody.image{flex-direction:column;justify-content:flex-start}
#artbody.image img{flex:0 1 auto;min-height:0;margin:auto}
.stillbar{flex:0 0 auto;align-self:stretch;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;
  border-bottom:1px solid rgba(255,255,255,.14)}
.stilltag{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 10px;border-radius:6px;
  border:1px solid rgba(255,255,255,.28);background:rgba(8,10,16,.84);color:#fff;font:600 12px/1.3 system-ui,sans-serif}
.stillbar button{padding:5px 11px;border-radius:6px;border:1px solid #8673ba;background:#383151;
  color:#fff;font:600 12px/1.3 system-ui,sans-serif;cursor:pointer}
.stillbar button:hover{background:#4a4070}
.artfollow{display:flex;align-items:center;gap:5px;font:10px var(--mono);color:var(--dim);cursor:pointer;
  white-space:nowrap;padding:0 4px}
.artfollow input{margin:0;accent-color:var(--accent,#7c6cf0)}
.artnote{padding:7px 12px;font:10px var(--mono);color:var(--faint);border-top:1px solid var(--line);
  background:var(--bg2);flex:0 0 auto}
/* Phase 6: forms, tweaks, point mode */
.artmode{all:unset;cursor:pointer;font:12px system-ui,sans-serif;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.08);margin-left:6px;opacity:.85}
.artmode.on{background:rgba(120,90,255,.45);opacity:1}
.mention{display:flex;gap:8px;align-items:center;margin:0 0 6px;padding:6px 10px;border-radius:8px;background:rgba(120,90,255,.18);font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap}
.mention button{all:unset;cursor:pointer;padding:0 6px;opacity:.7}
.qform{margin:10px 0;padding:14px 16px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.qform .qtitle{font-weight:600;margin-bottom:8px}
.qform fieldset{border:0;padding:8px 0;margin:0;border-top:1px solid rgba(255,255,255,.07)}
.qform legend{font-weight:500;padding:0}
.qform .qsub{opacity:.6;font-size:12px;margin:2px 0 6px}
.qform .qopt{display:block;padding:3px 0}
.qform .qimgs{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 10px}
.qform .qimg{flex:1 1 320px;min-width:0;margin:0}
.qform .qimg img{display:block;width:100%;height:auto;max-height:480px;object-fit:contain;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:#fff}
.qform .qimg figcaption{font:11px ui-monospace,monospace;opacity:.6;margin-top:4px}
.qform .qother{margin-top:4px;width:60%}
.qform .qsvg{display:inline-block;margin:4px 8px 4px 0;text-align:center}
.qform .qsvg .qsvgbox{display:block;width:96px;height:68px;border:1px solid rgba(255,255,255,.15);border-radius:6px;overflow:hidden;background:#fff}
.qform .qsvg iframe{width:96px;height:68px;border:0;pointer-events:none}
.qform .qsvg input:checked + .qsvgbox{outline:2px solid rgba(120,90,255,.9)}
.qform textarea{width:100%;min-height:56px}
.qform input[type=range]{width:60%;vertical-align:middle}
.qform output{margin-left:8px;font:12px ui-monospace,monospace}
.qform .qacts{padding-top:10px}
.qform .qacts button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;background:rgba(120,90,255,.6);font-weight:500}
.dlcard{display:flex;gap:12px;align-items:center;margin:10px 0;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.dlcard .ic{font-size:20px}.dlcard .t{flex:1;display:flex;flex-direction:column}.dlcard .t span{opacity:.6;font-size:12px}
.dlcard a.go{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;background:rgba(120,90,255,.6);font-weight:500}
/* Phase 8: visual answers */
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;animation:in .18s ease-out}
.vcard .vh{font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 9px}
.vcard .vh b{color:var(--fg);letter-spacing:0;text-transform:none;font:500 12.5px var(--sans)}
.vcard .vs{color:var(--dim);font-size:12.5px;font-style:italic;margin-top:8px}
.vcard p{margin:4px 0 6px}.vcard ul{margin:4px 0;padding-left:18px}
.vcard a{color:var(--cyan)}
.vcard .dom{color:var(--faint);font:10.5px var(--mono);margin-left:8px}
.vcard .price{color:var(--ok);font:600 12px var(--mono);margin-left:8px}
.vcard .pill{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:99px;background:#1b2030;color:var(--dim);margin:4px 6px 0 0}
.vcard .tscroll{overflow-x:auto}
.vcard table.cmp{border-collapse:collapse;width:100%;font-size:13px}
.vcard table.cmp th,.vcard table.cmp td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.vcard table.cmp thead th{background:#1b2030}
.vcard table.cmp tbody th{color:var(--dim);font-weight:500;white-space:nowrap}
.vcard .prow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.vcard .ptile{flex:0 0 240px;background:#0d1017;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.vcard .ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vcard .opt{background:#0d1017;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.vcard .place,.vcard .lnk{padding:7px 0;border-top:1px solid var(--line)}
.vcard .place:first-of-type,.vcard .lnk:first-of-type{border-top:0}
.vcard details.day,.vcard details.q,.vcard ol.steps details{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:0 0 6px;background:#0d1017}
.vcard summary{cursor:pointer;font-weight:500}
.vcard .time{color:var(--cyan);font:11px var(--mono);margin-right:8px}
.vcard ol.steps{padding-left:22px}.vcard ol.steps li{margin:4px 0}
.vcard .tr2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vcard .tr2>div{background:#0d1017;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.vcard .tr2 p{font-size:15px}.vcard .tr2 i{color:var(--dim);display:block;margin-bottom:6px}
.vcard button.opt,.vcard button.copy{all:unset;cursor:pointer;display:block;padding:6px 10px;border-radius:7px;border:1px solid var(--line);margin:4px 0;font-size:13px}
.vcard button.copy{display:inline-block;font:11px var(--mono);color:var(--dim);padding:3px 8px}
.vcard button.opt:hover{border-color:var(--violet)}
.vcard .opt.right{border-color:var(--ok);color:var(--ok)}.vcard button.opt.wrong{border-color:var(--err);color:var(--err)}
.vcard .expl{margin-top:8px;color:var(--dim);font-size:13px}.vcard .hint{color:var(--faint);font-size:12px}
.vcard .fb{margin-top:4px;font-size:13px}.vcard .fb.ok{color:var(--ok)}.vcard .fb.bad{color:var(--err)}
.vcard .irow{display:flex;gap:8px;flex-wrap:wrap}
.vcard .irow a{display:flex;flex-direction:column;gap:3px;font:10.5px var(--mono);color:var(--faint);text-decoration:none}

  <aside id="rail">

      <label class="artfollow" id="artfollow" title="Follow the model's view: what it loads in its hidden frame, each edit to that file and each screenshot it saves appear here live, so you can steer as it works. Off: only what it shows you explicitly. Starting state: studio.follow_model_view in the runtime settings."><input type="checkbox" id="artfollowbox" checked> follow</label>

    <span id="perf" title="Last request: prompt reading speed, generation speed, and how full the context window is"></span>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const COMPANION = document.documentElement.classList.contains('companion');
let companion = null;
const $ = id => document.getElementById(id);
const stream = $('stream'), main = $('main');
const feed = DreamFeed.mount(stream);
let replayingHistory = false, working = false, sending = false;
let socket, current = null, thinking = null, tools = new Map(), nTool = 0, nMsg = 0, retry = 0, replayOnConnect = false;
let writing = null;   // the tool call being written, shown live and then replaced by its card

/* ---------- rendering ---------------------------------------------------- */
// Model output is untrusted: escape FIRST, then apply markup to the escaped
// text. Nothing here ever inserts raw model text as HTML.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function md(src){
  const blocks = [];
  let t = esc(src);
  // fenced code first, stashed so inline rules can't touch it
  t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `␀${blocks.push(`<pre><code data-lang="${lang}">${code.replace(/\n$/,'')}</code></pre>`) - 1}␀`);
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/^###### (.*)$/gm,'<h3>$1</h3>').replace(/^##### (.*)$/gm,'<h3>$1</h3>')
       .replace(/^#### (.*)$/gm,'<h3>$1</h3>').replace(/^### (.*)$/gm,'<h3>$1</h3>')
       .replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  t = t.replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>');
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
       .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g,'$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/^\d+\. (.*)$/gm,'<li>$1</li>');
  t = t.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');
  t = t.split(/\n{2,}/).map(p =>
        /^<(h\d|ul|ol|pre|blockquote|table)/.test(p.trim()) ? p : (p.trim() ? `<p>${p}</p>` : '')
      ).join('');
  return t.replace(/␀(\d+)␀/g, (_, i) => blocks[+i]);
}

const atBottom = () => main.scrollHeight - main.scrollTop - main.clientHeight < 120;
let followingFeed = true, scrollFrame = null, lastScrollTop = main.scrollTop;
function syncFeedPosition(){
  const top = main.scrollTop;
  // Content growth alone must not disable following. Only moving back through
  // the feed pauses it; returning to the bottom resumes it.
  if(atBottom()) followingFeed = true;
  else if(top < lastScrollTop) followingFeed = false;
  lastScrollTop = top;
}
main.addEventListener('scroll', syncFeedPosition, {passive:true});
function scroll(force){
  if(force) followingFeed = true;
  if(!followingFeed || scrollFrame !== null) return;
  scrollFrame = requestAnimationFrame(() => {
    scrollFrame = null;
    if(!followingFeed) return;
    main.scrollTop = main.scrollHeight;
    lastScrollTop = main.scrollTop;
  });
}
// Text wrapping, expanded tool cards and viewport changes can move the bottom
// even without another server event.
const feedResize = new ResizeObserver(() => scroll());
feedResize.observe(stream);
feedResize.observe(main);

function block(role, label){
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  d.innerHTML = `<div class="who">${esc(label)}</div><div class="body"></div>`;
  stream.appendChild(d);
  companion?.message?.();
  scroll();
  return d.querySelector('.body');
}
function sysline(text, kind){
  if(kind === 'error') companion?.error(text);
  const d = document.createElement('div');
  d.className = 'sys' + (kind ? ' ' + kind : '');
  d.textContent = text; stream.appendChild(d); scroll();
}
function renderPermission(data){
  if(companion){ companion.permission(data); return; }
  if(!data?.id || document.getElementById('permission-' + data.id)) return;
  const el = document.createElement('section'); el.className = 'permission-card'; el.id = 'permission-' + data.id;
  el.innerHTML = `<h3>Dream needs your permission</h3><p>${esc(data.reason)}</p><pre>${esc(data.tool)}\n${esc(JSON.stringify(data.input, null, 2))}</pre><div></div>`;
  for(const [choice, label] of Object.entries(data.choices || {})){
    const button = document.createElement('button'); button.textContent = label;
    button.onclick = async () => {
      el.querySelectorAll('button').forEach(b => b.disabled = true);
      try {
        const response = await fetch('/api/permission', {method:'POST', headers:{'Content-Type':'application/json','X-Dream-Token':TOKEN}, body:JSON.stringify({id:data.id, choice})});
        const body = await response.json(); if(!response.ok) throw new Error(body.error);
        el.remove();
      } catch(e){ sysline(e.message, 'error'); el.querySelectorAll('button').forEach(b => b.disabled = false); }
    };
    el.querySelector('div').appendChild(button);
  }
  stream.appendChild(el); scroll(true);
}
function finishPermission(id){
  if(companion) companion.permissionDone(id);
  else document.getElementById('permission-' + id)?.remove();
}
function clearWriting(){ if(writing){ writing.remove(); writing = null; } }
function endTurn(){
  clearWriting();
  if(current){
    current.el.innerHTML = md(current.raw);
    // Scan only on completion: a half-streamed fence is not an artifact yet.
    if(!replayingHistory) try{ scanForArtifacts(current.raw, current.seq); }catch(e){ console.error(e); }
    current = null;
  }
  thinking = null; scroll();
}

/* ---------- event handling ---------------------------------------------- */
function handle(m){
  // A server event can arrive after the reader moves but before the browser's
  // queued scroll event. Capture that movement before adding more content.
  syncFeedPosition();
  const replay = replayOnConnect;
  if(!['hello','history','permission'].includes(m.kind) && !replayingHistory) replayOnConnect = false;
  if(COMPANION && ['text_delta', 'thinking_delta', 'tool_use', 'tool_preview'].includes(m.kind)) busy(true);
  switch(m.kind){
    case 'project_view_reset': {
      artifacts.clear(); artOpen = null; artVerIdx = 0;
      closeArtifactFrame(); panel.classList.remove('open');
      companion?.closeArtifact(); companion?.artifacts();
      window.dispatchEvent(new Event('dream:project-reset'));
      break;
    }
    case 'history': {
      const liveSteeringTarget = steeringTarget;
      replayingHistory = true; endTurn(); current = null; thinking = null; tools.clear(); feed.reset(); nTool = 0; nMsg = 0;
      stream.querySelectorAll('.msg,.tool,.think,.sys,.permission-card,.turn-timing').forEach(el => el.remove());
      $('plan-panel').hidden = true;
      busy(false); replayingHistory = true;
      try {
        if(m.data?.trimmed) sysline('Showing recent conversation. Earlier messages remain in the saved session.');
        for(const event of m.data?.events || []) handle(event);
      } finally { replayingHistory = false; steeringTarget = liveSteeringTarget; }
      for(const receipt of steeringSnapshot) steeringNotice(receipt);
      companion?.message?.(); counts(); scroll(true);
      break;
    }
    case 'user': {
      endTurn();
      // A "Read ×2" message is stored doubled; show the words once.
      const said = String(m.data || ''), again = said.indexOf(READ_AGAIN);
      block('you','You').textContent = again >= 0 ? said.slice(0, again) : said;
      nMsg++; counts(); scroll(true); break;
    }
    case 'turn_start': busy(true); break;
    case 'turn_end': steeringTarget = null; endTurn(); finishTools(m.data?.interrupted ? 'Interrupted' : 'No result returned'); busy(false); break;
    case 'steering': steeringNotice(m.data); break;
    case 'steering_ready': steeringTarget = m.data; break;
    case 'permission': renderPermission(m.data); break;
    case 'permission_done': finishPermission(m.data?.id); break;
    case 'council_activity': window.dispatchEvent(new CustomEvent('dream:council-activity',{detail:m.data})); break;
    case 'hello': {
      const s = m.data || {};
      steeringTarget = s.steering_target || null;
      steeringSnapshot = Array.isArray(s.steering_receipts) ? s.steering_receipts : [];
      $('meta').innerHTML = [
        s.provider && `<span><b>${esc(s.provider)}</b></span>`,
        s.model && `<span>${esc(s.model)}</span>`,
        s.workspace && `<span>${esc(String(s.workspace).replace(/^.*\//,'📁 '))}</span>`,
        s.session_id && `<span>${esc(s.session_id)}</span>`,
      ].filter(Boolean).join('');
      companion?.session(s);
      break;
    }
    case 'text_delta': {
      thinking = null;
      if(!current){ current = {el: block('dream','Dream'), raw: '', seq: ++nMsg}; }
      current.raw += m.data;
      current.el.innerHTML = md(current.raw) + '<span class="cursor"></span>';
      scroll();
      break;
    }
    case 'tool_preview': {
      // MachX streams a tool call's text while the model writes it, so a long
      // write_file is visible instead of silent. Display only: the card that
      // replaces this comes from tool_use, and nothing here is replayed.
      if(replayingHistory) break;
      if(!writing){
        endTurn();
        writing = document.createElement('pre');
        writing.className = 'tool-preview';
        writing.setAttribute('aria-label', 'Tool call being written');
        stream.append(writing);
      }
      writing.textContent += m.data;
      if(writing.textContent.length > 40000) writing.textContent = writing.textContent.slice(-40000);
      writing.scrollTop = writing.scrollHeight;
      scroll();
      break;
    }
    case 'thinking_delta': {
      if(!thinking){
        thinking = feed.thinking(stream);
      }
      feed.thought(thinking, m.data); scroll();
      break;
    }
    case 'stats': perf(m.data); break;
    case 'plan': renderPlan(m.data); break;
    case 'assistant_done': endTurn(); break;
    case 'tool_use': {
      endTurn();   // also removes the live preview of this very call
      const d = m.data || {}, name = String(d.name||'tool').split('__').pop();
      if(!replayingHistory && /^(write_file|Write|Edit|MultiEdit)$/.test(name)){
        try{ artifactFromWrite(d.input || {}); }catch(e){ console.error(e); }
      }
      const el = feed.tool(stream, d); companion?.message?.();
      if(d.id) tools.set(d.id, el);
      if(!replayingHistory) noteFile(name, d.input || {});
      nTool++; counts(); scroll();
      break;
    }
    case 'tool_result': {
      const d = m.data || {}, el = tools.get(d.id);
      if(!el) break;
      tools.delete(d.id);
      feed.result(el, d);
      scroll();
      break;
    }
    case 'agent_activity': feed.activity(m.data); companion?.message?.(); scroll(); break;
    case 'studio': {
      // Dream asked to show a file (show_to_user / done). Same pipeline as a
      // written file, so the chip write_file made is reused, not duplicated.
      const d = m.data || {};
      if(d.op === 'follow'){ setFollow(!!d.on); break; }
      if(d.op === 'removed'){
        // The model deleted the file the owner was looking at (DREAM-104): the canvas
        // empties and says so; nothing moves focus or the view.
        const key = `file:${d.path}`, wasOpen = artOpen === key;
        artifacts.delete(key);
        if(wasOpen){
          closeArtifactFrame(); artOpen = null; $('artext').style.display = 'none';
          $('artname').textContent = `${d.title || d.path} — removed`;
          $('artnote').textContent = 'the model deleted this file';
          companion?.frameLoaded();
        }
        companion?.artifacts();
        break;
      }
      if(d.op === 'show' && d.kind === 'image'){
        // A screenshot the model saved, or an image a tool wrote (DREAM-104).
        mirroring = d.source === 'mirror';
        try{ openImage(d, replay); }
        catch(e){ console.error(e); companion?.error('The image could not be shown. Ask Dream to show it again.'); }
        finally{ mirroring = false; }
        break;
      }
      if(d.op === 'show'){
        // Reconnect replays the same explicit show. Keep live form values and
        // the user's chosen view when that exact preview is already open.
        const shown = COMPANION && artifacts.get(artOpen);
        if(replay && shown && artOpen === `file:${d.path}` && shown.versions[shown.versions.length-1] === d.content
            && (artView === 'code' || artbody.querySelector('iframe'))) break;
        // A mirrored show is the model's own view, not a handoff (DREAM-104): a reload
        // of the page already open keeps the view the owner chose.
        const mirror = d.source === 'mirror';
        if(COMPANION && !(mirror && artOpen === `file:${d.path}`)) artView = 'preview';
        // Every paint this show causes (addArtifact repaints an open artifact before
        // openArtifact runs) must say it is mirrored, or the navigation would switch views.
        mirroring = mirror;
        try{ const a = artifactFromWrite({path: d.path, content: d.content});
          if(a) openArtifact(a.key, {mirror}); else companion?.error('This file cannot be previewed. Ask Dream to show an HTML or SVG version.'); }
        catch(e){ console.error(e); companion?.error('The preview could not be opened. Ask Dream to show it again.'); }
        finally{ mirroring = false; }
      } else if(d.op === 'eval' || d.op === 'snapshot'){
        askFrame(d);
      } else if(d.op === 'ask'){
        try{ renderForm(d.form || {}); }catch(e){ console.error(e); }
      } else if(d.op === 'download'){
        try{ renderDownload(d); }catch(e){ console.error(e); }
      } else if(d.op === 'widget'){
        try{ renderWidget(d); }catch(e){ console.error(e); }
      }
      break;
    }
    case 'turn_timing':
      stream.appendChild(DreamTurnTiming.render(m.data)); companion?.message?.(); scroll(); break;
    case 'background_work': {
      const status = DreamTurnTiming.background(m.data);
      if(status) sysline(status);
      break;
    }
    case 'system': sysline(String(m.data ?? '')); break;
    case 'error':  clearWriting(); sysline(String(m.data ?? ''), 'error'); busy(false); break;
    case 'result': {
      endTurn(); busy(false);
      if(!replayingHistory && turnFiles.size){
        // What this turn changed on disk, in one line (the terminal already tallies it).
        const list = [...turnFiles].map(([p, how]) => `${how} ${p.split('/').slice(-2).join('/')}`);
        sysline(`Files this turn: ${list.slice(0, 12).join(', ')}${list.length > 12 ? ` … +${list.length - 12} more` : ''}`);
        turnFiles.clear();
      }
      if(m.data?.subtype === 'length'){
        const notice = document.createElement('div'); notice.className = 'sys incomplete-answer';
        notice.textContent = 'This answer reached the output limit and may be incomplete. ';
        const more = document.createElement('button'); more.textContent = 'Continue answer';
        more.onclick = async () => {
          more.disabled = true;
          const sent = await postPrompt('Continue the interrupted answer from where you stopped. Check existing results first; do not repeat completed actions.');
          if(!sent) more.disabled = false;
        };
        notice.appendChild(more); stream.appendChild(notice); scroll();
      } else if(m.data?.subtype === 'tool_round_limit'){
        // The per-turn step budget ran out; the work so far is real (Dream fix #19).
        const notice = document.createElement('div'); notice.className = 'sys incomplete-answer';
        notice.textContent = 'This turn used its tool-step budget. ';
        const more = document.createElement('button'); more.textContent = 'Continue';
        more.onclick = async () => {
          more.disabled = true;
          const sent = await postPrompt('Continue from where you stopped. Check existing results first; do not repeat completed actions.');
          if(!sent) more.disabled = false;
        };
        notice.appendChild(more); stream.appendChild(notice); scroll();
      } else if(m.data?.is_error) {
        sysline('The turn did not complete successfully. Review the reported error and partial results before retrying.', 'error');
      }
      const st = (m.data && m.data.stats) || {};
      if(st.gen_tps) sysline(`${st.gen_tps.toFixed(1)} tok/s · ${(st.duration_s||0).toFixed(1)}s`);
      break;
    }
  }
}

function finishTools(label){
  for(const el of tools.values()){ el.querySelector('.badge').textContent = label; el.classList.add('incomplete'); }
  tools.clear();
}

function counts(){ $('counts').textContent = `${nMsg} replies · ${nTool} tool calls`; }
// "Read ×2" (owner idea): typed messages go to the model twice; only this viewer's preference is stored.
const READ_AGAIN = '\n\n[Read the request above again:]\n';
let readTwice = false;
try{ readTwice = localStorage.getItem('dream.readTwice') === '1'; }catch(e){}
function syncReadTwice(){
  const b = $('read-twice'); if(!b) return;
  b.setAttribute('aria-pressed', String(readTwice)); b.classList.toggle('on', readTwice);
}
document.addEventListener('click', e => {
  if(!e.target.closest?.('#read-twice')) return;
  readTwice = !readTwice;
  try{ localStorage.setItem('dream.readTwice', readTwice ? '1' : '0'); }catch(err){}
  syncReadTwice();
});
window.syncReadTwice = syncReadTwice;
setTimeout(syncReadTwice, 0);
// Fresh start (DREAM-113): this conversation becomes a short handoff now, between turns only. The button
// and /fresh ask the same route; Dream refuses while a turn or queued input runs, and this line says why.
async function freshStart(){
  const b = $('fresh-start');
  if(b) b.disabled = true;
  try{
    const r = await fetch('/api/control', {method:'POST', headers:{'Content-Type':'application/json','X-Dream-Token':TOKEN},
                                          body: JSON.stringify({action:'fresh_start'})});
    if(!r.ok){ const data = await r.json().catch(() => ({})); sysline(data.error || `Fresh start failed (HTTP ${r.status})`, 'error'); }
  }catch(e){ sysline('Could not reach Dream. Reconnect, then try Fresh start again.', 'error'); }
  finally{ if(b) b.disabled = working; }
}
document.addEventListener('click', e => { if(e.target.closest?.('#fresh-start')) freshStart(); });
// The project's phased plan (update_plan), pinned above the chat.
function renderPlan(plan){
  const el = $('plan-panel'), phases = (plan && plan.phases) || [];
  if(!phases.length){ el.hidden = true; return; }
  const steps = phases.flatMap(p => p.steps || []), done = steps.filter(s => s.status === 'done').length;
  const current = phases.findIndex(p => p.status !== 'done');
  const wasOpen = el.hidden ? true : el.open;
  el.replaceChildren();
  const head = document.createElement('summary');
  head.textContent = `Plan${plan.title ? ': ' + plan.title : ''} — ` + (current < 0 ? `all ${phases.length} phases done`
    : `phase ${current + 1} of ${phases.length}: ${phases[current].name}`) + ` · ${done}/${steps.length} steps`;
  el.append(head);
  const list = document.createElement('ol');
  phases.forEach((p, i) => {
    const li = document.createElement('li'); li.className = 'plan-phase ' + p.status;
    const name = document.createElement('div'); name.innerHTML = '<span class="dot"></span>'; name.append(p.name);
    li.append(name);
    if(i === current || p.status === 'in_progress'){
      const ul = document.createElement('ul');
      for(const s of p.steps || []){
        const st = document.createElement('li'); st.className = 'plan-step ' + s.status;
        st.innerHTML = '<span class="dot"></span>'; st.append(s.name); ul.append(st);
      }
      li.append(ul);
    }
    if(p.summary && p.status === 'done'){ li.title = p.summary; }
    list.append(li);
  });
  el.append(list); el.open = wasOpen; el.hidden = false;
}
const turnFiles = new Map();
function noteFile(name, input){
  const how = {write_file: input.append ? 'appended' : 'wrote', Write: 'wrote', str_replace_edit: 'edited', Edit: 'edited',
               MultiEdit: 'edited', delete_file: 'deleted', copy_files: 'copied'}[name];
  if(!how) return;
  const paths = [input.path, input.file_path, ...(Array.isArray(input.paths) ? input.paths : []), input.dest].filter(p => typeof p === 'string' && p);
  for(const p of paths) if(!turnFiles.has(p)) turnFiles.set(p, how);
}
// The last request's speed and context use, like a local runner's status line.
function perf(s){
  if(!s) return;
  const fresh = Math.max(0, (s.prompt_tokens ?? s.pp_n) - (s.cached || 0));
  const parts = [];
  if(s.pp_ms > 0 && fresh > 0) parts.push(`prefill ${Math.round(fresh * 1000 / s.pp_ms).toLocaleString()} tok/s`);
  if(s.gen_ms > 0 && s.gen_n > 0) parts.push(`decode ${(s.gen_n * 1000 / s.gen_ms).toFixed(1)} tok/s`);
  if(s.prompt_tokens && s.window){
    const cached = s.cached ? ` (${Math.round(s.cached / 1000)}K cached)` : '';
    parts.push(`context ${s.prompt_tokens.toLocaleString()} / ${s.window.toLocaleString()}${cached}`);
  }
  $('perf').textContent = parts.join(' · ');
}
function busy(on){ working = on; if($('fresh-start')) $('fresh-start').disabled = on; if($('send')) $('send').textContent = on ? 'Queue' : 'Send'; if($('steer')) $('steer').hidden = !on; if($('stop')) $('stop').hidden = !on; $('dot').className = 'dot ' + (on ? 'busy' : (socket && socket.readyState===1 ? 'on':'off'));
  $('stat').textContent = on ? 'working' : (socket && socket.readyState===1 ? 'live' : 'offline');
  companion?.status(on);
}

/* ---------- transport ---------------------------------------------------- */
let reconnectTimer;
function connect(){
  clearTimeout(reconnectTimer);
  if(socket && socket.readyState < 2) return;
  socket = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws?token=${encodeURIComponent(TOKEN)}&history=1`);
  socket.onopen = () => { retry = 0; replayOnConnect = true; busy(false); setFollow(true); companion?.connection(true); };
  socket.onmessage = e => { try{ handle(JSON.parse(e.data)); }catch(err){ console.error(err); } };
  socket.onclose = () => {
    busy(false); $('dot').className='dot off'; $('stat').textContent='reconnecting';
    // The terminal session outlives this page; back off and rejoin it.
    retry = Math.min(retry + 1, 6);
    companion?.connection(false);
    reconnectTimer = setTimeout(connect, 250 * 2 ** retry);
  };
}

/* ---------- composer ----------------------------------------------------- */
const input = $('input'), send = $('send');
let steeringDraft = null, steeringTarget = null, steeringSnapshot = [];
function steeringNotice(receipt){
  if(!receipt || typeof receipt.status !== 'string') return;
  // A note Dream wrote itself (the progress guard's) travels the owner's steering path; its receipt names its
  // origin, and the pane shows it as Dream's, never as a correction the owner sent.
  if(typeof receipt.origin === 'string' && receipt.origin.startsWith('dream:')){
    const said = {pending:'saved; it goes with the next model request after current tools finish.',
      included:'added to the next request context; it has not yet been sent.',
      submitted:'sent with a model request.',
      retained:'retained without a confirmed submission; there is nothing for you to resubmit.'}[receipt.status];
    const who = receipt.origin === 'dream:progress_guard' ? "Dream's progress-guard note" : "Dream's own note";
    if(said) sysline(`${who}, not from you: ${said}` + (receipt.warning ? ' ' + receipt.warning : ''), 'dream-note');
    return;
  }
  const messages = {pending:'Correction saved; waiting for the next model request after current tools finish.',
    included:'Correction added to the next request context; it has not yet been sent.',
    submitted:'Correction sent with a model request. This does not confirm that the model followed it.',
    retained:'Correction retained without a confirmed submission. Inspect the saved session, receipt and existing effects before resubmitting.',
    queued_after_turn:'This agent or run does not support live steering. Message queued after the active turn or run.'};
  if(messages[receipt.status]) sysline(messages[receipt.status] + (receipt.warning ? ' ' + receipt.warning : '') +
    (receipt.status === 'retained' && receipt.recovery_path ? ' Receipt: ' + receipt.recovery_path : ''));
}
function grow(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,190)+'px'; }
async function submit(delivery = 'queue'){
  const typed = input.value.trim(), fileIds = draftAttachments.ids();
  if((!typed && !fileIds.length) || sending) return;
  if(typed.toLowerCase() === '/fresh' && !fileIds.length && delivery === 'queue'){
    input.value = ''; grow(); freshStart(); return;   // the control's route, never a message to the model
  }
  if(!draftAttachments.ready()){ sysline('Finish uploading, retry, or remove failed attachments before sending.', 'error'); return; }
  sending = true; draftAttachments.render();
  const savedInput = input.value, savedMention = mention;
  const text = mention ? mentionBlock(mention) + '\n' + typed : typed;
  const fingerprint = JSON.stringify([text, fileIds]);
  if(delivery === 'steer' && steeringDraft?.fingerprint !== fingerprint)
    steeringDraft = {fingerprint, id:crypto.randomUUID().replaceAll('-', ''), target:steeringTarget};
  const sent = await postPrompt(text, fileIds, delivery, delivery === 'steer' ? steeringDraft : undefined,
                               delivery === 'queue' && readTwice);
  sending = false;
  if(sent){
    if(input.value === savedInput) input.value = '';
    if(mention === savedMention) clearMention();
    draftAttachments.sent(fileIds); grow(); companion?.submitted();
    steeringDraft = null;
  } else { companion?.compose(); draftAttachments.render(); }
  draftAttachments.save();
}
// The one place this page speaks to Dream in the user's name: their typed message,
// or a card's button he pressed. Nothing a page or widget does reaches here.
async function postPrompt(text, attachments = [], delivery = 'queue', steering, twice = false){
  const wasWorking = working;
  busy(true);
  try{
    const r = await fetch('/api/prompt', {method:'POST',
      headers:{'Content-Type':'application/json','X-Dream-Token':TOKEN},
      body: JSON.stringify({prompt:text, attachments, ...(twice ? {read_twice:true} : {}), ...(delivery === 'steer' ? {delivery, steering_id:steering.id, steering_target:steering.target} : {})})});
    if(!r.ok) { const data = await r.json().catch(() => ({})); sysline(data.error || `Could not send (HTTP ${r.status})`,'error'); busy(wasWorking); return false; }
    if(delivery === 'steer') steeringNotice((await r.json()).steering);
    if($('studio-error')) $('studio-error').hidden = true;
    return true;
  }catch(e){ sysline('Could not reach Dream. Reconnect and send your message again.','error'); busy(wasWorking); return false; }
}
send.onclick = () => submit();
$('steer').onclick = () => submit('steer');
input.addEventListener('input', grow);
input.addEventListener('keydown', e => {
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); submit(); }
});

// Polled, not pushed: a sensor read has nothing to do with whether the model

const rail = $('rail'), railbody = $('railbody');
$('railtoggle').onclick = () => rail.classList.toggle('hide');

const n1 = v => (v == null ? null : (+v).toFixed(1));
const gb = mib => (mib == null ? null : (mib / 1024).toFixed(1));

function gpuCard(d){
  const used = d.vram_used_mib, total = d.vram_total_mib;
  const pct = (used != null && total) ? Math.min(100, used / total * 100) : null;
  const hot = (d.temp_c != null && d.temp_c >= 80) || (pct != null && pct >= 92);
  const rows = [
    (used != null && total) && `<div class="kv"><span>vram</span><b>${gb(used)} / ${gb(total)} GB</b></div>`,
    d.power_w != null && `<div class="kv"><span>power</span><b>${Math.round(d.power_w)}${d.power_cap_w?` / ${Math.round(d.power_cap_w)}`:''} W</b></div>`,
    d.temp_c != null && `<div class="kv"><span>temp</span><b>${Math.round(d.temp_c)}°C${d.vram_temp_c!=null?` · vram ${Math.round(d.vram_temp_c)}°`:''}</b></div>`,
    d.freq_mhz != null && `<div class="kv"><span>clock</span><b>${d.freq_mhz}${d.freq_max_mhz?` / ${d.freq_max_mhz}`:''} MHz</b></div>`,
    d.fan_rpm != null && `<div class="kv"><span>fan</span><b>${d.fan_rpm} rpm</b></div>`,
    d.util_pct != null && `<div class="kv"><span>util</span><b>${Math.round(d.util_pct)}%</b></div>`,
  ].filter(Boolean).join('');
  return `<div class="card">
    <div class="nm">${esc(d.name || 'GPU ' + d.index)}</div>
    <div class="bdf">${esc(d.bdf || '')}${d.integrated ? ' · integrated' : ''}</div>
    ${pct != null ? `<div class="bar${hot?' hot':''}"><i style="width:${pct}%"></i></div>` : ''}
    ${rows}</div>`;
}

function renderTelemetry(t){
  if(!t || t.available === false){
    railbody.innerHTML = `<div class="rail-h">telemetry</div>
      <div class="kv" style="color:var(--faint)">${esc(t && t.error ? t.error : 'unavailable')}</div>`;
    return;
  }
  const inf = t.inference || {}, sess = inf.session || {};
  const live = inf.live_tps ?? inf.gen_tps;
  const decoding = inf.state && inf.state !== 'idle';
  let html = '<div class="rail-h">inference</div><div class="card">';
  html += `<div class="big">${live != null ? n1(live) : '—'}<small> tok/s</small>
    ${decoding ? `<span class="pill live">${esc(inf.state)}</span>` : ''}</div>`;
  const irows = [
    inf.ttft_s != null && `<div class="kv"><span>ttft</span><b>${n1(inf.ttft_s)} s</b></div>`,
    inf.pp_tps != null && `<div class="kv"><span>prefill</span><b>${n1(inf.pp_tps)} tok/s</b></div>`,
    inf.pp_time_s != null && `<div class="kv"><span>prompt time</span><b>${n1(inf.pp_time_s)} s</b></div>`,
    inf.prompt_tokens != null && `<div class="kv"><span>prompt</span><b>${(+inf.prompt_tokens).toLocaleString()} tok</b></div>`,
  ].filter(Boolean).join('');
  html += (irows ? `<div style="margin-top:8px">${irows}</div>` : '') + '</div>';
  if(sess.turns){
    html += `<div class="card">
      <div class="kv"><span>turns</span><b>${sess.turns}</b></div>
      <div class="kv"><span>in / out</span><b>${(sess.in_tokens||0).toLocaleString()} / ${(sess.out_tokens||0).toLocaleString()}</b></div>
      ${sess.avg_tps != null ? `<div class="kv"><span>session avg</span><b>${n1(sess.avg_tps)} tok/s</b></div>` : ''}</div>`;
  }
  const g = t.gpu;
  if(g && g.ok && (g.devices||[]).length){
    html += '<div class="rail-h" style="margin-top:14px">gpu</div>';
    html += g.devices.filter(d => !d.integrated || g.devices.length === 1).map(gpuCard).join('');
  } else if(g && !g.ok){
    html += `<div class="rail-h" style="margin-top:14px">gpu</div>
      <div class="kv" style="color:var(--faint)">${esc(g.reason || 'no devices')}</div>`;
  }
  railbody.innerHTML = html;
}

async function pollTelemetry(){
  try{
    if(COMPANION && !working && (rail.classList.contains('hide') || tab !== 'metrics')) return;
    const r = await fetch(`/api/telemetry`, {headers:{'X-Dream-Token':TOKEN}});
    if(r.ok){ const data = await r.json(); renderTelemetry(data); companion?.progress?.(data.inference); }
  }catch(e){ /* the terminal may be gone; the reconnect loop reports that */ }
  finally{ setTimeout(pollTelemetry, 1000); }
}

const ago = iso => {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if(!isFinite(s)) return '';
  if(s < 60) return `${s|0}s ago`;
  if(s < 3600) return `${s/60|0}m ago`;
  if(s < 86400) return `${s/3600|0}h ago`;
  return `${s/86400|0}d ago`;
};

function paintDiff(el, text){
  el.innerHTML = esc(text).split('\n').map(l =>
    l.startsWith('+') ? `<span class="a">${l}</span>` :
    l.startsWith('-') ? `<span class="d">${l}</span>` :
    l.startsWith('@@') || l.startsWith('#') ? `<span class="h">${l}</span>` : l
  ).join('\n');
}

undobody.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]'); if(!btn) return;
  const card = btn.closest('.cp'), id = card.dataset.id, pane = card.querySelector('.cpdiff');
  if(btn.dataset.act === 'diff'){
    if(pane.style.display !== 'none'){ pane.style.display = 'none'; return; }
    pane.style.display = ''; pane.textContent = 'loading…';
    try{
      const r = await fetch(`/api/checkpoints/${encodeURIComponent(id)}/diff`,
        {headers:{'X-Dream-Token':TOKEN}});
      const j = await r.json();
      if(!r.ok) pane.textContent = j.error || 'could not diff';
      else paintDiff(pane, j.diff || '(nothing has changed since)');
    }catch(err){ pane.textContent = 'could not reach Dream'; }
    return;
  }
  // restore — writes to disk, so confirm, and offer force only as a follow-up
  if(!confirm(`Roll ${id} back to its pre-turn state?\n\nThis overwrites the current files on disk.`)) return;
  btn.disabled = true; btn.textContent = 'restoring…';
  try{
    const r = await fetch(`/api/checkpoints/${encodeURIComponent(id)}/restore`,
      {method:'POST', headers:{'Content-Type':'application/json','X-Dream-Token':TOKEN},
       body: JSON.stringify({})});
    const rep = await r.json();
    pane.style.display = '';
    const lines = [];
    (rep.restored||[]).forEach(p => lines.push(`+ restored ${p}`));
    (rep.deleted||[]).forEach(p => lines.push(`- deleted ${p}`));
    (rep.unchanged||[]).forEach(p => lines.push(`  unchanged ${p}`));
    (rep.skipped||[]).forEach(s => lines.push(`# SKIPPED ${s[0]} — ${s[1]}`));
    paintDiff(pane, lines.join('\n') || '(nothing to do)');
    sysline(`checkpoint ${id}: restored ${(rep.restored||[]).length}, skipped ${(rep.skipped||[]).length}`);
    if((rep.skipped||[]).length && confirm(
        `${rep.skipped.length} file(s) were skipped because Dream can't prove it wrote them last.\n\nForce the restore anyway?`)){
      const f = await fetch(`/api/checkpoints/${encodeURIComponent(id)}/restore`,
        {method:'POST', headers:{'Content-Type':'application/json','X-Dream-Token':TOKEN},
         body: JSON.stringify({force:true})});
      const rep2 = await f.json();
      paintDiff(pane, (rep2.restored||[]).map(p => `+ restored ${p}`).join('\n') || '(nothing)');
    }
  }catch(err){ sysline('restore failed — is the terminal still running?','error'); }
  btn.disabled = false; btn.textContent = 'restore';
});

/* ---------- artifacts ----------------------------------------------------- */
/* Renderable output — a page, a diagram, a chart — gets a panel instead of
   scrolling past as 200 lines of markup.

   THE SECURITY MODEL, because this renders text a model wrote:
   - `sandbox="allow-scripts"` WITHOUT `allow-same-origin`. That pair together
     would defeat the sandbox entirely: the frame would share this origin and
     could reach the parent DOM and the session token in the URL. Apart, the
     frame gets a unique opaque origin and can do neither.
   - srcdoc, never a src URL, so nothing is fetched to build the frame.
   - a CSP inside the document that blocks every network destination, so a
     generated page cannot phone home with what it can see.
   - no allow-top-navigation, no allow-popups, no allow-forms.
   Together: scripts run so a page is actually testable, and that is all. */

// 'unsafe-eval' is the one addition for the bridge below (eval_js_user_view).
// Inside a sandboxed, network-less, opaque-origin frame that already runs the
// artifact's own inline scripts, eval adds no reach the frame did not have.
const ART_CSP = "default-src 'none'; style-src 'unsafe-inline'; " +
                "img-src data: blob:; media-src data: blob:; font-src data:; script-src 'unsafe-inline' 'unsafe-eval'";

// Injected ahead of every artifact body. Answers Dream's questions about the
// page the user is looking at: __dream_eval (run code; an expression returns its
// value, a block returns what it returns) and __dream_snapshot (the live DOM as
// HTML with form values baked in). Replies go to the parent by postMessage; the
// parent, not the frame, holds the token and talks to Dream.
const ART_BRIDGE = `<script>(function(){
  function safe(v){
    if(v instanceof Node){ var el = v.nodeType === 1 ? v : null;
      return el ? ('<' + el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + (el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\\s+/).join('.') : '') + '> ' + (el.textContent || '').trim().slice(0, 120)) : v.nodeName; }
    if(v instanceof Map) v = Object.fromEntries(v); else if(v instanceof Set) v = Array.from(v);
    if(typeof v === 'number' && !isFinite(v)) return String(v);
    try{ return JSON.parse(JSON.stringify(v === undefined ? null : v)); }catch(e){ return String(v); } }
  function run(code){ var f; try{ f = new Function('return (' + code + '\\n)'); }catch(e){ f = new Function(code); } return f(); }
  function snapshot(){
    document.querySelectorAll('input, textarea, select').forEach(function(el){
      if(el.tagName === 'TEXTAREA'){ el.textContent = el.value; }
      else if(el.tagName === 'SELECT'){ Array.prototype.forEach.call(el.options, function(o){ if(o.selected) o.setAttribute('selected',''); else o.removeAttribute('selected'); }); }
      else if(el.type === 'checkbox' || el.type === 'radio'){ if(el.checked) el.setAttribute('checked',''); else el.removeAttribute('checked'); }
      else { el.setAttribute('value', el.value); }
    });
    return '<!doctype html>' + document.documentElement.outerHTML;
  }
  // A widget's sendPrompt: text lands in the user's composer; only the user sends it.
  window.sendPrompt = function(t){ if(navigator.userActivation && !navigator.userActivation.isActive) return; parent.postMessage({type:'__dream_send_prompt', text:String(t == null ? '' : t).slice(0, 4000)}, '*'); };
  var mediaLast = 0;
  ['error','loadedmetadata','playing','timeupdate'].forEach(function(kind){
    document.addEventListener(kind,function(e){
      var m=e.target;if(!m||!['VIDEO','AUDIO'].includes(m.tagName))return;
      if(kind==='timeupdate'&&Date.now()-mediaLast<1500)return;
      mediaLast=Date.now();
      parent.postMessage({type:'__dream_media_state',state:kind,time:Number(m.currentTime)||0,
        error:m.error?m.error.code:null},'*');
    },true);
  });
  // What the page does in the owner's Studio, told to Dream (DREAM-111): uncaught errors
  // (a module that does not parse included), unhandled rejections, console.error, a file
  // the frame could not load, a lost WebGL context -- or a clean load. Installed before the
  // page's own scripts run; the first report goes 800 ms after load, later news after that.
  var rep = {errors: [], lost: 0, loaded: false, sent: 0, timer: 0};
  function repSend(phase){ rep.sent++; parent.postMessage({type:'__dream_load_report', phase: phase, errors: rep.errors.slice(0, 20), webgl_lost: rep.lost}, '*'); }
  function repLater(){ if(!rep.loaded || rep.sent > 10) return; clearTimeout(rep.timer); rep.timer = setTimeout(function(){ repSend('update'); }, 800); }
  function repNote(line){ line = String(line).slice(0, 500); if(rep.errors.length < 20 && rep.errors.indexOf(line) < 0) rep.errors.push(line); repLater(); }
  function repText(v){ if(v && v.message) return String(v.message); if(typeof v === 'string') return v; try{ return JSON.stringify(v); }catch(e){ return String(v); } }
  window.addEventListener('error', function(e){
    var t = e.target;
    if(t && t !== window && t.tagName){ repNote('failed to load <' + t.tagName.toLowerCase() + ' ' + (t.getAttribute('src') || t.getAttribute('href') || '') + '> (the Studio frame loads nothing by URL)'); return; }
    repNote('error: ' + (e.message || 'Error') + (e.filename ? ' (' + e.filename + ':' + e.lineno + ':' + e.colno + ')' : ''));
  }, true);
  window.addEventListener('unhandledrejection', function(e){ repNote('unhandled rejection: ' + repText(e.reason)); });
  var repConsole = console.error;
  console.error = function(){ try{ repNote('console.error: ' + Array.prototype.map.call(arguments, repText).join(' ')); }catch(_){} return repConsole.apply(console, arguments); };
  var repContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function(kind){
    var c = repContext.apply(this, arguments);
    if(c && /webgl/i.test(String(kind)) && !this.__dreamWatch){ this.__dreamWatch = true; this.addEventListener('webglcontextlost', function(){ rep.lost++; repLater(); }); }
    return c;
  };
  window.addEventListener('load', function(){ setTimeout(function(){ rep.loaded = true; repSend('load'); }, 800); });
  var pointing = false, ccN = 0;
  function reactChain(el){
    var key = Object.keys(el).find(function(k){ return k.indexOf('__reactFiber') === 0; });
    var out = [], f = key ? el[key] : null, guard = 0;
    while(f && guard++ < 40){ var t = f.type; if(typeof t === 'function' && t.name) out.unshift(t.name); f = f.return; }
    return out.join(' > ');
  }
  function domPath(el){
    var parts = [], n = el, guard = 0;
    while(n && n.nodeType === 1 && n !== document.documentElement && guard++ < 8){
      var s = n.tagName.toLowerCase();
      if(n.id) s += '#' + n.id;
      else if(n.className && typeof n.className === 'string') s += '.' + n.className.trim().split(/\\s+/).slice(0,2).join('.');
      parts.unshift(s); n = n.parentElement;
    }
    return parts.join(' > ');
  }
  function onPoint(e){
    if(!pointing) return;
    e.preventDefault(); e.stopPropagation();
    var el = e.target; if(!el || el.nodeType !== 1) return;
    var id = 'cc-' + (++ccN); el.setAttribute('data-cc-id', id);
    var lab = el.closest('[data-screen-label]');
    parent.postMessage({type:'__dream_mention', id:id, dom: domPath(el), react: reactChain(el),
      label: lab ? lab.getAttribute('data-screen-label') : '', text: (el.textContent || '').trim().slice(0, 80)}, '*');
  }
  document.addEventListener('click', onPoint, true);
  window.addEventListener('message', function(e){
    var d = e.data || {};
    if(d.type === '__dream_point_on'){ pointing = true; document.documentElement.style.cursor = 'crosshair'; return; }
    if(d.type === '__dream_point_off'){ pointing = false; document.documentElement.style.cursor = ''; return; }
    if(d.type === '__dream_ping'){ parent.postMessage({type:'__dream_pong'}, '*'); return; }
    if(d.type !== '__dream_eval' && d.type !== '__dream_snapshot') return;
    var reply = function(ok, value){ parent.postMessage({type:'__dream_reply', id:d.id, ok:ok, value:value}, '*'); };
    try{
      var out = d.type === '__dream_snapshot' ? snapshot() : run(String(d.code || ''));
      Promise.resolve(out).then(function(v){ reply(true, safe(v)); }, function(err){ reply(false, String(err && err.message || err)); });
    }catch(err){ reply(false, String(err && err.message || err)); }

const artifacts = new Map();       // key -> {key,title,kind,versions:[str]}
let artOpen = null, artVerIdx = 0, artView = 'preview';
let mirroring = false;             // a mirrored show (the model's own view) is being applied (DREAM-104)
let lastLive = null;               // the last live page shown, for "Back to live page" under a still (DREAM-111)
const panel = $('artpanel'), artbody = $('artbody');

/* ---------- the owner's view, reported to Dream (DREAM-111) ----------------- */
// The bridge in each artifact frame posts what the page did; this page adds which file and
// which exact content it is (a CRC-32 of the content's UTF-16 code units, the same function
// as dream.tools.mirror.digest) and passes it on. The Studio tools read it back to tell the
// model what the owner actually sees. The frame itself holds no token and cannot fetch.
function studioDigest(s){
  const t = studioDigest.table || (studioDigest.table = Array.from({length: 256}, (_, n) => {
    let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c; }));
  let c = -1;
  for(let i = 0; i < s.length; i++){
    const u = s.charCodeAt(i);
    c = t[(c ^ u) & 255] ^ (c >>> 8);
    c = t[(c ^ (u >>> 8)) & 255] ^ (c >>> 8);
  }
  return ((c ^ -1) >>> 0).toString(16).padStart(8, '0');
}
function studioReport(r){
  fetch('/api/studio_report', {method:'POST', headers:{'Content-Type':'application/json','X-Dream-Token':TOKEN},
    body: JSON.stringify(r)}).catch(() => {});
}
window.addEventListener('message', e => {
  const f = artbody.querySelector('iframe'), d = e.data;
  if(!f || e.source !== f.contentWindow || !d || d.type !== '__dream_load_report' || !f._report) return;
  const errors = Array.isArray(d.errors) ? d.errors.slice(0, 20).map(x => String(x).slice(0, 500)) : [];
  const lost = Number.isInteger(d.webgl_lost) ? Math.min(Math.max(d.webgl_lost, 0), 10000) : 0;
  studioReport({...f._report, status: 'loaded', phase: d.phase === 'update' ? 'update' : 'load', errors, webgl_lost: lost});
});

const RENDERABLE = {html:'HTML', svg:'SVG', xml:'SVG'};

function artKind(lang, body){
  const l = (lang||'').toLowerCase();
  if(RENDERABLE[l]) return l === 'xml' ? 'svg' : l;
  if(/^\s*<svg[\s>]/i.test(body)) return 'svg';
  if(/^\s*(<!doctype html|<html[\s>])/i.test(body)) return 'html';
  return null;
}

function addArtifact(key, title, kind, body){
  let a = artifacts.get(key);
  if(!a){ a = {key, title, kind, versions:[]}; artifacts.set(key, a); }
  // Identical re-emission isn't a new version — streaming re-renders the same
  // block many times as it completes.
  if(a.versions[a.versions.length-1] === body) return a;
  a.versions.push(body);
  a.kind = kind;
  renderChip(a);
  companion?.artifacts();
  if(artOpen === key){ artVerIdx = a.versions.length - 1; paintArtifact(); }
  return a;
}

function renderChip(a){
  if(COMPANION) return;
  let chip = document.querySelector(`.artchip[data-k="${CSS.escape(a.key)}"]`);
  const n = a.versions.length;
  const html = `<div class="ic">${a.kind === 'svg' ? 'SVG' : a.kind === 'image' ? 'IMG' : '&lt;/&gt;'}</div>
    <div class="t"><b>${esc(a.title)}</b>
      <span>${a.kind.toUpperCase()} · ${n} version${n>1?'s':''} · click to open</span></div>
    <div class="go">open →</div>`;
  if(chip){ chip.innerHTML = html; return; }
  chip = document.createElement('div');
  chip.className = 'artchip'; chip.dataset.k = a.key; chip.innerHTML = html;
  chip.onclick = () => openArtifact(a.key);
  stream.appendChild(chip); scroll();
}

function openArtifact(key, opts){
  const a = artifacts.get(key); if(!a) return;
  artOpen = key; artVerIdx = a.versions.length - 1;
  // Three columns is one too many at laptop widths — the transcript ends up
  // narrower than either thing flanking it. The rail steps aside; the toggle
  // brings it back if you want both.
  if(window.innerWidth < 1500) rail.classList.add('hide');
  panel.classList.add('open');
  companion?.openArtifact(opts);
  paintArtifact(opts);
}

/* ---------- following the model's view (DREAM-104) --------------------------- */
// The pane mirrors what the model loads in its hidden frame, each edit to that file
// and each screenshot it saves, unless this is off. The state lives on the server
// (one per session): the model's tools consult it, every pane hears a change, and a
// pane that connects assumes on until the server says otherwise.
let followModel = true;
function setFollow(on){ followModel = !!on; $('artfollowbox').checked = followModel; }
$('artfollowbox').onchange = async e => {
  const on = e.target.checked;
  try{
    const r = await fetch('/api/follow', {method:'POST', headers:{'Content-Type':'application/json','X-Dream-Token':TOKEN},
      body: JSON.stringify({on})});
    const j = await r.json(); if(!r.ok) throw new Error(j.error || 'could not change following');
    setFollow(j.on);
    sysline(on ? "Following the model's view: what it loads, edits and captures appears here."
               : "Not following the model's view: only what it shows you explicitly appears here.");
  }catch(err){ setFollow(!on); sysline(err.message, 'error'); }
};

// An image the model saved, served by the token-checked download route (workspace
// files only, like the visual_check form's images); the stamp makes a re-saved file
// with the same name load again instead of coming from the cache.
function imageHref(path, stamp){
  return '/api/download?path=' + encodeURIComponent(String(path || '')) + '&token=' + encodeURIComponent(TOKEN)
    + '&v=' + encodeURIComponent(String(stamp || ''));
}
function openImage(d, replay){
  const path = String(d.path || ''); if(!path) return;
  const key = `file:${path}`, stamp = String(d.stamp || Date.now());
  let a = artifacts.get(key);
  if(!a || a.kind !== 'image'){ a = {key, title: path.split('/').pop(), kind: 'image', versions: []}; artifacts.set(key, a); }
  if(a.versions[a.versions.length-1] !== stamp) a.versions.push(stamp);
  else if(replay && artOpen === key) return;   // reconnect replays what is already showing
  a.path = path; a.size = d.size ? (d.size / 1024).toFixed(1) + ' KB' : '';
  renderChip(a);
  companion?.artifacts();
  if(COMPANION && artOpen !== key) artView = 'preview';
  openArtifact(key, {mirror: d.source === 'mirror'});
}

/* ---------- open in browser (DREAM-111) ------------------------------------- */
// The open file, read-only, in the owner's own browser: served from a separate local origin
// that holds no Dream token (the desktop hands the click to the default browser), where ES
// modules load -- a file:// page cannot import them.
async function updatePageLink(){
  const link = $('artext'), path = artifactFilePath(), key = artOpen;
  link.style.display = 'none'; link.removeAttribute('href');
  if(!path) return;
  try{
    const r = await fetch('/api/page_link?path=' + encodeURIComponent(path), {headers:{'X-Dream-Token':TOKEN}, cache:'no-store'});
    const j = await r.json();
    if(!r.ok || !j.url || artOpen !== key) return;
    link.href = j.url; link.style.display = '';
  }catch(e){}
}

function paintArtifact(opts){
  const a = artifacts.get(artOpen); if(!a) return;
  $('artname').textContent = a.title;
  const sel = $('artver');
  sel.innerHTML = a.versions.map((_, i) =>
    `<option value="${i}"${i===artVerIdx?' selected':''}>v${i+1}${i===a.versions.length-1?' (latest)':''}</option>`
  ).join('');
  // An image's versions are only load stamps; the route serves the file as it is now.
  sel.style.display = a.versions.length > 1 && a.kind !== 'image' ? '' : 'none';
  $('artprev').classList.toggle('on', artView === 'preview');
  $('artcode').classList.toggle('on', artView === 'code');
  companion?.paintArtifact(a);
  updatePageLink();
  // The workspace navigation listens: a mirrored show is the model's own view and must
  // not pull the owner away from the page they chose (DREAM-104, gate 1).
  const mirror = mirroring || !!(opts && opts.mirror);
  window.dispatchEvent(new CustomEvent("dream:artifact", {detail: {mirror}}));
  if(a.kind === 'image'){
    tweaksAvail = false; $('arttweaks').style.display = 'none';
    frameReady = false;
    if(artView === 'code'){
      artbody.className = 'code';
      artbody.innerHTML = `<pre>${esc(a.path)}${a.size ? '\n' + esc(a.size) : ''}</pre>`;
      $('artnote').textContent = 'image file · ' + a.path;
      companion?.frameLoaded();
      return;
    }
    artbody.className = 'image';
    const img = document.createElement('img');
    img.alt = a.title; img.decoding = 'async';
    img.addEventListener('load', () => companion?.frameLoaded(), {once: true});
    img.addEventListener('error', () => { $('artnote').textContent = 'the image could not be loaded from the workspace'; companion?.frameLoaded(); }, {once: true});
    img.src = imageHref(a.path, a.versions[artVerIdx]);
    // A still says it is one (DREAM-111): live, a saved screenshot in this pane read as an
    // animation that froze. When a live page was showing, one click brings it back.
    const bar = document.createElement('div');
    bar.className = 'stillbar'; bar.setAttribute('role', 'note');
    const tag = document.createElement('span');
    tag.className = 'stilltag'; tag.textContent = 'Still image: ' + a.path; tag.title = tag.textContent;
    bar.append(tag);
    const live = lastLive && lastLive !== artOpen && artifacts.get(lastLive);
    if(live){
      const back = document.createElement('button');
      back.type = 'button'; back.id = 'artlive'; back.textContent = 'Back to live page · ' + live.title;
      back.onclick = () => { artView = 'preview'; openArtifact(lastLive); };
      bar.append(back);
    }
    artbody.replaceChildren(bar, img);
    $('artnote').textContent = 'still image · ' + a.path + ' · a saved picture, not the running page';
    return;
  }
  lastLive = artOpen;
  const body = a.versions[artVerIdx] || '';
  const file = artifactFilePath();
  if(artView === 'code'){
    artbody.className = 'code';
    artbody.innerHTML = `<pre>${esc(body)}</pre>`;
    $('artnote').textContent = `${body.length.toLocaleString()} chars`;
    // The page is not running here; the model hears that instead of silence (DREAM-111).
    if(file) studioReport({path: file, digest: studioDigest(body), status: 'code', phase: 'load', errors: [], webgl_lost: 0});
    return;
  }
  artbody.className = '';
  const csp = `<meta http-equiv="Content-Security-Policy" content="${ART_CSP}">`;
  // A widget (visualize_show_widget) gets the tokens visualize_read_me promised.
  const tokens = a.widget ? WIDGET_STYLE : '';
  // Dream's own head goes FIRST, before a single byte of the artifact, for every
  // kind of body: the parser puts a leading meta and script into the implied
  // <head>, and whatever the artifact says later — its own doctype, <html>,
  // <head> — is merged or ignored, never moved ahead of ours. The old version
  // spliced the CSP in at the first "<head"/"<html" match, so a page with
  // '<head>' inside a script string or a comment got the meta in its BODY,
  // where Chromium ignores it and the frame ran with no CSP at all (Gate 8).
  const doc = `<!doctype html>${csp}${ART_BRIDGE}${tokens}` + (a.kind === 'svg'
    ? `<style>html,body{margin:0;height:100%;background:#fff}body{display:flex;align-items:center;justify-content:center}
       svg{width:100%;height:auto;max-height:100%}</style>${body}`
    : body);
  tweaksAvail = false; $('arttweaks').style.display = 'none';
  const f = document.createElement('iframe');
  // allow-scripts WITHOUT allow-same-origin — see the note above.
  f.setAttribute('sandbox', 'allow-scripts');
  f.setAttribute('referrerpolicy', 'no-referrer');
  f.title = a.title + ' preview';
  // Which file and which exact content this frame runs, for its load report (DREAM-111).
  f._report = file ? {path: file, digest: studioDigest(body)} : null;
  f.srcdoc = doc;
  artbody.innerHTML = ''; artbody.appendChild(f);
  $('artnote').textContent = (a.widget ? 'widget · ' : '') + 'sandboxed · no network, no access to this page';
  frameReady = false;
  f.addEventListener('load', () => {
    frameReady = true;
    companion?.frameLoaded();
    if(!f.contentWindow) return;
    // Is the document in the frame still the one Dream gave it? A page can
    // navigate itself away (location.href, <meta refresh>) — no sandbox flag or
    // CSP directive stops that in Chromium; what can be stopped is it staying.
    // A load counter misses a page that navigates while still parsing (one
    // load: the destination's), so every load is asked: the bridge answers a
    // ping, and a document without the bridge is not Dream's.
    f._pong = setTimeout(() => {
      if(!f.isConnected) return;   // already replaced by a newer paint
      f.remove();
      $('artnote').textContent = 'closed — the page navigated away from its own document';
      sysline('artifact closed — it navigated away from its own document', 'error');
      companion?.frameClosed();
    }, 3000);
    f.contentWindow.postMessage({type:'__dream_ping'}, '*');
    if(pointOn) f.contentWindow.postMessage({type:'__dream_point_on'}, '*');
  });
}

window.addEventListener('message', e => {
  const f=artbody.querySelector('iframe'),d=e.data;
  if(!f || e.source!==f.contentWindow || !d || d.type!=='__dream_media_state') return;
  if(!['error','loadedmetadata','playing','timeupdate'].includes(d.state))return;
  window.dispatchEvent(new CustomEvent('dream:media-state',{detail:{state:d.state,time:Number.isFinite(d.time)?d.time:0,error:d.error}}));
});

/* ---------- download cards (present_fs_item_for_download) ------------------- */
// A link straight to the file (or a zip of the folder). The token has to ride in
// the query — a link carries no headers — and it is already in this page's URL.
function renderDownload(d){
  endTurn();
  const el = document.createElement('div');
  el.className = 'dlcard';
  const href = '/api/download?path=' + encodeURIComponent(String(d.path || '')) + '&token=' + encodeURIComponent(TOKEN);
  el.innerHTML = `<div class="ic">⬇</div>
    <div class="t"><b>${esc(d.label || d.path || 'Project')}</b><span>${esc(d.kind || '')}</span></div>
    <a class="go" download>download</a>`;
  el.querySelector('a').href = href;
